<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>かえるぱち・実写盤</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zl1sAAAAASUVORK5CYII=">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
    }
    body { display: grid; place-items: center; }
    canvas {
      display: block;
      height: 100vh;
      height: 100dvh;
      width: auto;
      max-width: 100vw;
      aspect-ratio: 2 / 3;
      background: #120807;
    }
  </style>
</head>
<body>
  <canvas id="machine" width="1024" height="1536" aria-label="実写風の自動パチンコ台"></canvas>

  <script>
  (() => {
    'use strict';

    const canvas = document.getElementById('machine');
    const ctx = canvas.getContext('2d', { alpha: false });
    const W = canvas.width;
    const H = canvas.height;
    const params = new URLSearchParams(location.search);
    const debug = params.get('debug') === '1';
    const recordMode = params.get('record') === '1';
    const requestedSkin = params.get('skin') || 'kaeru';
    const skin = ['kaeru', 'neko', 'inu'].includes(requestedSkin) ? requestedSkin : 'kaeru';
    const bg = new Image();

    window.__events = [];
    let eventsLogged = false;

    const BALL_R = 11;
    const NAIL_R = 4;
    const GRAVITY = 880;
    const MAX_BALLS = 82;
    const balls = [];
    let elapsed = 0;
    let fireClock = 0;
    let windAngle = 0;

    function recordEvent(type, x, y) {
      window.__events.push({
        t: Number(elapsed.toFixed(4)),
        type,
        x: Number(x.toFixed(1)),
        y: Number(y.toFixed(1))
      });
    }

    let nails = [];
    let windmills = [];
    let displayRect;
    let heso;
    let railPoints = [];
    let railLengths = [];
    let railTotalLength = 0;
    let out;

    function configureGeometry(data) {
      nails = data.pins.map(([x, y]) => ({ x, y, r: NAIL_R }));
      displayRect = { x: data.lcd[0], y: data.lcd[1], w: data.lcd[2], h: data.lcd[3] };
      windmills = data.windmills.map(([x, y, r], index) => ({
        x, y, r, dir: index % 2 === 0 ? 1 : -1
      }));

      const [hesoX, hesoY, hesoW, hesoH] = data.heso;
      const hesoCenterX = hesoX + hesoW / 2;
      heso = {
        x: hesoCenterX,
        y: hesoY + hesoH / 2,
        r: Math.min(hesoW, hesoH) / 2,
        openingLeft: hesoCenterX - hesoW * 0.278,
        openingRight: hesoCenterX + hesoW * 0.278,
        entryTop: hesoY + hesoH * 0.076,
        entryBottom: hesoY + hesoH * 0.792
      };

      // JSONは上端→発射口の順。玉が発射口→上端へ進むよう反転して使う。
      railPoints = data.rail.slice().reverse().map(([x, y]) => ({ x, y }));
      railLengths = [0];
      for (let i = 1; i < railPoints.length; i++) {
        railLengths.push(railLengths[i - 1] + Math.hypot(
          railPoints[i].x - railPoints[i - 1].x,
          railPoints[i].y - railPoints[i - 1].y
        ));
      }
      railTotalLength = railLengths[railLengths.length - 1];
      out = { x: data.out[0], y: data.out[1], r: 43 };

      window.__skin = skin;
      window.__geometry = data;
      canvas.dataset.skin = skin;
    }

    function railPoint(t) {
      const target = Math.max(0, Math.min(1, t)) * railTotalLength;
      let segment = 1;
      while (segment < railLengths.length - 1 && railLengths[segment] < target) segment++;
      const startLength = railLengths[segment - 1];
      const segmentLength = railLengths[segment] - startLength || 1;
      const localT = (target - startLength) / segmentLength;
      const start = railPoints[segment - 1];
      const end = railPoints[segment];
      return {
        x: start.x + (end.x - start.x) * localT,
        y: start.y + (end.y - start.y) * localT
      };
    }

    function launchStrength(t) {
      return 0.5 + Math.sin(t * 0.73) * 0.055 + Math.sin(t * 1.91 + 1.4) * 0.025;
    }

    function spawnBall() {
      if (balls.length >= MAX_BALLS) return;
      const power = launchStrength(elapsed) + (Math.random() - 0.5) * 0.025;
      const launchPoint = railPoints[0];
      balls.push({
        x: launchPoint.x,
        y: launchPoint.y,
        vx: 0,
        vy: 0,
        r: BALL_R,
        age: 0,
        railT: 0,
        power,
        contacts: new Set()
      });
      recordEvent('launch', launchPoint.x, launchPoint.y);
    }

    function hitCircle(ball, px, py, pr, bounce = 0.58) {
      const dx = ball.x - px;
      const dy = ball.y - py;
      const minDistance = ball.r + pr;
      const distance2 = dx * dx + dy * dy;
      if (distance2 >= minDistance * minDistance || distance2 < 0.0001) return false;
      const distance = Math.sqrt(distance2);
      const nx = dx / distance;
      const ny = dy / distance;
      const overlap = minDistance - distance;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const approach = ball.vx * nx + ball.vy * ny;
      if (approach < 0) {
        ball.vx -= (1 + bounce) * approach * nx;
        ball.vy -= (1 + bounce) * approach * ny;
        ball.vx += (Math.random() - 0.5) * 12;
      }
      return true;
    }

    function hitSegment(ball, x1, y1, x2, y2, bounce = 0.52) {
      const sx = x2 - x1;
      const sy = y2 - y1;
      const length2 = sx * sx + sy * sy;
      const t = Math.max(0, Math.min(1, ((ball.x - x1) * sx + (ball.y - y1) * sy) / length2));
      return hitCircle(ball, x1 + sx * t, y1 + sy * t, 5, bounce);
    }

    function hitRect(ball, rect, bounce = 0.54) {
      const left = rect.x;
      const right = rect.x + rect.w;
      const top = rect.y;
      const bottom = rect.y + rect.h;
      const nearestX = Math.max(left, Math.min(right, ball.x));
      const nearestY = Math.max(top, Math.min(bottom, ball.y));
      const outside = ball.x < left || ball.x > right || ball.y < top || ball.y > bottom;

      if (outside) return hitCircle(ball, nearestX, nearestY, 0, bounce);

      const sides = [
        { distance: ball.x - left, nx: -1, ny: 0, x: left - ball.r, y: ball.y },
        { distance: right - ball.x, nx: 1, ny: 0, x: right + ball.r, y: ball.y },
        { distance: ball.y - top, nx: 0, ny: -1, x: ball.x, y: top - ball.r },
        { distance: bottom - ball.y, nx: 0, ny: 1, x: ball.x, y: bottom + ball.r }
      ];
      const side = sides.reduce((closest, candidate) =>
        candidate.distance < closest.distance ? candidate : closest
      );
      ball.x = side.x;
      ball.y = side.y;
      const approach = ball.vx * side.nx + ball.vy * side.ny;
      if (approach < 0) {
        ball.vx -= (1 + bounce) * approach * side.nx;
        ball.vy -= (1 + bounce) * approach * side.ny;
      }
      return true;
    }

    function hitWindmill(ball, windmill) {
      if (hitCircle(ball, windmill.x, windmill.y, windmill.r, 0.62)) {
        const dx = ball.x - windmill.x;
        const dy = ball.y - windmill.y;
        const distance = Math.max(1, Math.hypot(dx, dy));
        ball.vx += (-dy / distance) * 28 * windmill.dir;
        ball.vy += (dx / distance) * 28 * windmill.dir;
        return true;
      }
      return false;
    }

    function updateBall(ball, dt) {
      ball.age += dt;
      if (ball.railT < 1) {
        // 発射強度のわずかな揺らぎはレールを上る速度と盤面への放出速度に反映。
        ball.railT = Math.min(1, ball.railT + dt * (0.68 + ball.power * 0.2));
        const point = railPoint(ball.railT);
        ball.x = point.x;
        ball.y = point.y;
        if (ball.railT === 1) {
          ball.vx = 158 + ball.power * 115;
          ball.vy = -42 - ball.power * 46;
          ball.x += 2;
        }
        return true;
      }

      ball.vy += GRAVITY * dt;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.vx *= Math.pow(0.996, dt * 60);

      // 遊技領域の左右と天井。写真の外周レール内側に合わせた境界。
      const left = 145 + ball.r;
      const right = 884 - ball.r;
      const top = 113 + ball.r;
      if (ball.x < left) { ball.x = left; ball.vx = Math.abs(ball.vx) * 0.58; }
      if (ball.x > right) { ball.x = right; ball.vx = -Math.abs(ball.vx) * 0.58; }
      if (ball.y < top) { ball.y = top; ball.vy = Math.abs(ball.vy) * 0.5; }

      const contactsNow = new Set();
      for (let i = 0; i < nails.length; i++) {
        const nail = nails[i];
        if (hitCircle(ball, nail.x, nail.y, nail.r, 0.62)) {
          const key = `pin-${i}`;
          contactsNow.add(key);
          if (!ball.contacts.has(key)) recordEvent('pin', ball.x, ball.y);
        }
      }
      hitRect(ball, displayRect);
      for (let i = 0; i < windmills.length; i++) {
        if (hitWindmill(ball, windmills[i])) {
          const key = `wind-${i}`;
          contactsNow.add(key);
          if (!ball.contacts.has(key)) recordEvent('wind', ball.x, ball.y);
        }
      }
      ball.contacts = contactsNow;

      // ヘソの開口部だけは筒の円判定を通過させ、入賞玉として回収する。
      const inHesoOpening = ball.x > heso.openingLeft && ball.x < heso.openingRight;
      if (ball.vy > 0 && inHesoOpening && ball.y > heso.entryTop && ball.y < heso.entryBottom) {
        recordEvent('heso', ball.x, ball.y);
        return false;
      }
      hitCircle(ball, heso.x, heso.y, heso.r, 0.5);

      // 下部の丸いアウト口、または盤面の最下部へ達した玉を回収。
      const outDistance = Math.hypot(ball.x - out.x, ball.y - out.y);
      if ((ball.vy > 0 && outDistance < out.r) || ball.y > out.y + 88 || ball.age > 19) {
        recordEvent('out', ball.x, ball.y);
        return false;
      }
      return true;
    }

    function update(dt) {
      elapsed += dt;
      windAngle += dt * 2.75;
      const firing = !recordMode || elapsed < 10;
      canvas.dataset.firing = firing ? '1' : '0';
      canvas.dataset.ballCount = String(balls.length);
      fireClock -= dt;
      while (firing && fireClock <= 0) {
        spawnBall();
        fireClock += 1 / 6;
      }

      for (let i = balls.length - 1; i >= 0; i--) {
        if (!updateBall(balls[i], dt)) balls.splice(i, 1);
      }

      if (recordMode && !eventsLogged && elapsed >= 12) {
        eventsLogged = true;
        console.log('EVENTS ' + JSON.stringify(window.__events));
      }
    }

    function drawBall(ball) {
      ctx.save();
      // 写真下部の受け皿にある玉に合わせた、ガラス越しの暗いクロム。
      ctx.shadowColor = 'rgba(0, 0, 0, 0.32)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 1.5;
      ctx.shadowOffsetY = 3;
      const metal = ctx.createRadialGradient(
        ball.x - ball.r * 0.28,
        ball.y - ball.r * 0.42,
        ball.r * 0.02,
        ball.x + ball.r * 0.08,
        ball.y + ball.r * 0.16,
        ball.r * 1.02
      );
      metal.addColorStop(0, '#ffffff');
      metal.addColorStop(0.08, '#dce2e3');
      metal.addColorStop(0.25, '#747b7d');
      metal.addColorStop(0.52, '#373c3e');
      metal.addColorStop(0.76, '#1b2022');
      metal.addColorStop(0.9, '#090b0c');
      metal.addColorStop(1, '#313638');
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = metal;
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.save();
      ctx.clip();
      const reflectedColor = ctx.createLinearGradient(
        ball.x - ball.r, ball.y - ball.r,
        ball.x + ball.r, ball.y + ball.r
      );
      reflectedColor.addColorStop(0, 'rgba(151, 24, 15, 0.2)');
      reflectedColor.addColorStop(0.48, 'rgba(211, 126, 20, 0.07)');
      reflectedColor.addColorStop(0.78, 'rgba(239, 187, 59, 0.2)');
      reflectedColor.addColorStop(1, 'rgba(76, 20, 12, 0.12)');
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = reflectedColor;
      ctx.fillRect(ball.x - ball.r, ball.y - ball.r, ball.r * 2, ball.r * 2);
      ctx.restore();

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(8, 9, 10, 0.9)';
      ctx.lineWidth = 1.25;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(ball.x - 3.4, ball.y - 4.6, 2.7, 1.35, -0.45, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ball.x, ball.y + 1.3, ball.r * 0.74, 0.18, 2.55);
      ctx.strokeStyle = 'rgba(207, 146, 57, 0.2)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }

    function drawWindmill(windmill) {
      ctx.save();
      ctx.translate(windmill.x, windmill.y);
      ctx.rotate(windAngle * windmill.dir);
      ctx.globalAlpha = 0.46;
      ctx.fillStyle = '#ed3426';
      ctx.strokeStyle = 'rgba(255, 236, 173, 0.82)';
      ctx.lineWidth = 2;
      for (let arm = 0; arm < 5; arm++) {
        ctx.rotate(Math.PI * 0.4);
        ctx.beginPath();
        ctx.moveTo(5, -7);
        ctx.quadraticCurveTo(25, -14, 39, -3);
        ctx.quadraticCurveTo(27, 9, 7, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(223, 169, 45, 0.88)';
      ctx.fill();
      ctx.restore();
    }

    function drawDebug() {
      ctx.save();
      for (const nail of nails) {
        ctx.beginPath();
        ctx.arc(nail.x, nail.y, nail.r + BALL_R, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 229, 255, 0.12)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.92)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(nail.x - 1, nail.y - 1, 2, 2);
      }
      ctx.strokeStyle = '#00ff7f';
      ctx.lineWidth = 6;
      ctx.setLineDash([15, 10]);
      ctx.beginPath();
      for (let i = 0; i <= 80; i++) {
        const point = railPoint(i / 80);
        if (i === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ff2d9a';
      ctx.strokeRect(
        displayRect.x - BALL_R,
        displayRect.y - BALL_R,
        displayRect.w + BALL_R * 2,
        displayRect.h + BALL_R * 2
      );
      ctx.strokeStyle = '#ffdd00';
      for (const windmill of windmills) {
        ctx.beginPath();
        ctx.arc(windmill.x, windmill.y, windmill.r + BALL_R, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.strokeStyle = '#ff7a00';
      ctx.beginPath();
      ctx.arc(heso.x, heso.y, heso.r + BALL_R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(out.x, out.y, out.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawGlassHighlight() {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(512, 582, 467, 535, 0, 0, Math.PI * 2);
      ctx.clip();
      const shine = ctx.createLinearGradient(195, 80, 520, 690);
      shine.addColorStop(0, 'rgba(255,255,255,0)');
      shine.addColorStop(0.43, 'rgba(255,255,255,0)');
      shine.addColorStop(0.49, 'rgba(255,255,255,0.075)');
      shine.addColorStop(0.53, 'rgba(255,255,255,0.018)');
      shine.addColorStop(0.59, 'rgba(255,255,255,0)');
      ctx.fillStyle = shine;
      ctx.fillRect(50, 35, 900, 1080);
      ctx.restore();
    }

    function draw() {
      ctx.drawImage(bg, 0, 0, W, H);
      for (const windmill of windmills) drawWindmill(windmill);
      for (const ball of balls) drawBall(ball);
      if (debug) drawDebug();
      drawGlassHighlight();
    }

    let previous = 0;
    let accumulator = 0;
    const fixedStep = 1 / 120;
    function frame(now) {
      accumulator += Math.min(0.05, (now - previous) / 1000);
      previous = now;
      while (accumulator >= fixedStep) {
        update(fixedStep);
        accumulator -= fixedStep;
      }
      draw();
      requestAnimationFrame(frame);
    }

    let started = false;
    function start() {
      if (started) return;
      started = true;
      previous = performance.now();
      draw();
      canvas.dataset.ready = '1';
      requestAnimationFrame(frame);
    }

    bg.src = `${skin}_real_frame.png`;
    const imageReady = bg.decode();
    const geometryReady = fetch(`pins_${skin}.json`).then(response => {
      if (!response.ok) throw new Error(`pins_${skin}.json: HTTP ${response.status}`);
      return response.json();
    });

    Promise.all([imageReady, geometryReady]).then(([, geometry]) => {
      configureGeometry(geometry);
      start();
    }).catch(error => {
      console.error('Failed to initialize real pachinko:', error);
    });
  })();
  </script>
</body>
</html>
