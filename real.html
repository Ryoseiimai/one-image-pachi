<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>かえるぱち・実写盤</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zl1sAAAAASUVORK5CYII=">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
    }
    body { display: grid; place-items: center; }
    canvas {
      display: block;
      height: 100vh;
      height: 100dvh;
      width: auto;
      max-width: 100vw;
      aspect-ratio: 2 / 3;
      background: #120807;
    }
  </style>
</head>
<body>
  <canvas id="machine" width="1024" height="1536" aria-label="実写風の自動パチンコ台"></canvas>

  <script>
  (() => {
    'use strict';

    const canvas = document.getElementById('machine');
    const ctx = canvas.getContext('2d', { alpha: false });
    const W = canvas.width;
    const H = canvas.height;
    const params = new URLSearchParams(location.search);
    const debug = params.get('debug') === '1';
    const recordMode = params.get('record') === '1';
    const bg = new Image();
    bg.src = 'kaeru_real_frame.png';

    const BALL_R = 11;
    const GRAVITY = 880;
    const MAX_BALLS = 82;
    const balls = [];
    let elapsed = 0;
    let fireClock = 0;
    let windAngle = 0;

    // 写真の真鍮色の釘頭を目印に、画像座標で手置きした当たり判定。
    const nails = [];
    const row = (y, xs, r = 6.5) => xs.forEach(x => nails.push({ x, y, r }));

    // 上部の放射列。カエルの輪郭を避けながら左右へ流す。
    row(153, [476, 508, 539]);
    row(169, [444, 568]);
    row(188, [414, 600]);
    row(213, [383, 632]);
    row(247, [354, 660]);
    row(282, [326, 688]);
    row(321, [304, 710]);
    row(362, [333, 695]);

    // 液晶の左右を下へ導く釘列。
    [
      [194,474],[215,501],[238,529],[263,557],[286,587],[308,619],[331,649],
      [174,520],[195,551],[219,580],[244,610],[270,639],[299,668],[332,690],
      [155,574],[180,603],[207,632],[237,660],[270,685],[309,706],
      [830,474],[809,501],[786,529],[761,557],[738,587],[716,619],[693,649],
      [850,520],[829,551],[805,580],[780,610],[754,639],[725,668],[692,690],
      [869,574],[844,603],[817,632],[787,660],[754,685],[715,706]
    ].forEach(([x, y]) => nails.push({ x, y, r: 6.5 }));

    // 風車周辺から中央下部へ集まる放射状の釘列。
    row(704, [223, 260, 352, 386, 638, 672, 764, 801]);
    row(733, [196, 235, 278, 372, 407, 617, 652, 746, 789, 828]);
    row(770, [183, 224, 263, 368, 401, 623, 656, 761, 800, 841]);
    row(807, [192, 233, 274, 349, 389, 635, 675, 750, 791, 832]);
    row(844, [211, 252, 294, 337, 382, 642, 687, 730, 772, 813]);
    row(879, [231, 273, 316, 359, 405, 619, 665, 708, 751, 793]);
    row(914, [256, 300, 344, 390, 438, 586, 634, 680, 724, 768]);
    row(948, [287, 334, 381, 430, 478, 546, 594, 643, 690, 737]);
    row(981, [324, 374, 425, 476, 548, 599, 650, 700]);

    // ヘソ上の命釘2本。
    nails.push(
      { x: 482, y: 803, r: 7.5, life: true },
      { x: 542, y: 803, r: 7.5, life: true }
    );

    const windmills = [
      { x: 318, y: 758, r: 39, dir: 1 },
      { x: 704, y: 758, r: 39, dir: -1 }
    ];

    // 液晶まわりの透明枠。写真の表示部へ玉が潜り込まないための線分。
    const guards = [
      [377, 458, 647, 458],
      [365, 471, 365, 681],
      [659, 471, 659, 681],
      [385, 704, 639, 704]
    ];

    const rail = {
      p0: { x: 191, y: 979 },
      p1: { x: 111, y: 747 },
      p2: { x: 103, y: 278 },
      p3: { x: 246, y: 153 }
    };

    function bezierPoint(t) {
      const u = 1 - t;
      return {
        x: u*u*u*rail.p0.x + 3*u*u*t*rail.p1.x + 3*u*t*t*rail.p2.x + t*t*t*rail.p3.x,
        y: u*u*u*rail.p0.y + 3*u*u*t*rail.p1.y + 3*u*t*t*rail.p2.y + t*t*t*rail.p3.y
      };
    }

    function launchStrength(t) {
      return 0.5 + Math.sin(t * 0.73) * 0.055 + Math.sin(t * 1.91 + 1.4) * 0.025;
    }

    function spawnBall() {
      if (balls.length >= MAX_BALLS) return;
      const power = launchStrength(elapsed) + (Math.random() - 0.5) * 0.025;
      balls.push({
        x: rail.p0.x,
        y: rail.p0.y,
        vx: 0,
        vy: 0,
        r: BALL_R,
        age: 0,
        railT: 0,
        power
      });
    }

    function hitCircle(ball, px, py, pr, bounce = 0.58) {
      const dx = ball.x - px;
      const dy = ball.y - py;
      const minDistance = ball.r + pr;
      const distance2 = dx * dx + dy * dy;
      if (distance2 >= minDistance * minDistance || distance2 < 0.0001) return false;
      const distance = Math.sqrt(distance2);
      const nx = dx / distance;
      const ny = dy / distance;
      const overlap = minDistance - distance;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const approach = ball.vx * nx + ball.vy * ny;
      if (approach < 0) {
        ball.vx -= (1 + bounce) * approach * nx;
        ball.vy -= (1 + bounce) * approach * ny;
        ball.vx += (Math.random() - 0.5) * 12;
      }
      return true;
    }

    function hitSegment(ball, x1, y1, x2, y2, bounce = 0.52) {
      const sx = x2 - x1;
      const sy = y2 - y1;
      const length2 = sx * sx + sy * sy;
      const t = Math.max(0, Math.min(1, ((ball.x - x1) * sx + (ball.y - y1) * sy) / length2));
      return hitCircle(ball, x1 + sx * t, y1 + sy * t, 5, bounce);
    }

    function hitWindmill(ball, windmill) {
      hitCircle(ball, windmill.x, windmill.y, 13, 0.62);
      const rotation = windAngle * windmill.dir;
      for (let arm = 0; arm < 5; arm++) {
        const angle = rotation + arm * Math.PI * 0.4;
        for (let d = 20; d <= windmill.r; d += 10) {
          const x = windmill.x + Math.cos(angle) * d;
          const y = windmill.y + Math.sin(angle) * d;
          if (hitCircle(ball, x, y, 7, 0.62)) {
            ball.vx += -Math.sin(angle) * 28 * windmill.dir;
            ball.vy += Math.cos(angle) * 28 * windmill.dir;
          }
        }
      }
    }

    function updateBall(ball, dt) {
      ball.age += dt;
      if (ball.railT < 1) {
        // 発射強度のわずかな揺らぎはレールを上る速度と盤面への放出速度に反映。
        ball.railT = Math.min(1, ball.railT + dt * (0.68 + ball.power * 0.2));
        const point = bezierPoint(ball.railT);
        ball.x = point.x;
        ball.y = point.y;
        if (ball.railT === 1) {
          ball.vx = 158 + ball.power * 115;
          ball.vy = -42 - ball.power * 46;
          ball.x += 2;
        }
        return true;
      }

      ball.vy += GRAVITY * dt;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.vx *= Math.pow(0.996, dt * 60);

      // 遊技領域の左右と天井。写真の外周レール内側に合わせた境界。
      const left = 145 + ball.r;
      const right = 884 - ball.r;
      const top = 113 + ball.r;
      if (ball.x < left) { ball.x = left; ball.vx = Math.abs(ball.vx) * 0.58; }
      if (ball.x > right) { ball.x = right; ball.vx = -Math.abs(ball.vx) * 0.58; }
      if (ball.y < top) { ball.y = top; ball.vy = Math.abs(ball.vy) * 0.5; }

      for (const nail of nails) hitCircle(ball, nail.x, nail.y, nail.r, 0.62);
      for (const guard of guards) hitSegment(ball, ...guard);
      for (const windmill of windmills) hitWindmill(ball, windmill);

      // 写真中央の黒いヘソ開口部。
      if (ball.vy > 0 && ball.y > 811 && ball.y < 870 && ball.x > 468 && ball.x < 556) {
        return false;
      }

      // 下部の丸いアウト口、または盤面の最下部へ達した玉を回収。
      const outDistance = Math.hypot(ball.x - 512, ball.y - 1029);
      if ((ball.vy > 0 && outDistance < 43) || ball.y > 1117 || ball.age > 19) return false;
      return true;
    }

    function update(dt) {
      elapsed += dt;
      windAngle += dt * 2.75;
      const firing = !recordMode || elapsed < 10;
      canvas.dataset.firing = firing ? '1' : '0';
      canvas.dataset.ballCount = String(balls.length);
      fireClock -= dt;
      while (firing && fireClock <= 0) {
        spawnBall();
        fireClock += 1 / 6;
      }

      for (let i = balls.length - 1; i >= 0; i--) {
        if (!updateBall(balls[i], dt)) balls.splice(i, 1);
      }
    }

    function drawBall(ball) {
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.42)';
      ctx.shadowBlur = 7;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 5;
      const metal = ctx.createRadialGradient(
        ball.x - ball.r * 0.38,
        ball.y - ball.r * 0.43,
        ball.r * 0.07,
        ball.x,
        ball.y,
        ball.r
      );
      metal.addColorStop(0, '#ffffff');
      metal.addColorStop(0.16, '#e9eef1');
      metal.addColorStop(0.43, '#aab2b8');
      metal.addColorStop(0.72, '#626a70');
      metal.addColorStop(1, '#202529');
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = metal;
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = 'rgba(245, 250, 252, 0.72)';
      ctx.lineWidth = 0.9;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(ball.x - 3.8, ball.y - 4.6, 2.6, 1.7, -0.55, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fill();
      ctx.restore();
    }

    function drawWindmill(windmill) {
      ctx.save();
      ctx.translate(windmill.x, windmill.y);
      ctx.rotate(windAngle * windmill.dir);
      ctx.globalAlpha = 0.46;
      ctx.fillStyle = '#ed3426';
      ctx.strokeStyle = 'rgba(255, 236, 173, 0.82)';
      ctx.lineWidth = 2;
      for (let arm = 0; arm < 5; arm++) {
        ctx.rotate(Math.PI * 0.4);
        ctx.beginPath();
        ctx.moveTo(5, -7);
        ctx.quadraticCurveTo(25, -14, 39, -3);
        ctx.quadraticCurveTo(27, 9, 7, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(223, 169, 45, 0.88)';
      ctx.fill();
      ctx.restore();
    }

    function drawDebug() {
      ctx.save();
      ctx.globalAlpha = 0.53;
      for (const nail of nails) {
        ctx.beginPath();
        ctx.arc(nail.x, nail.y, nail.r + BALL_R, 0, Math.PI * 2);
        ctx.fillStyle = nail.life ? '#ff3b30' : '#00e5ff';
        ctx.fill();
      }
      ctx.strokeStyle = '#00ff7f';
      ctx.lineWidth = 6;
      ctx.setLineDash([15, 10]);
      ctx.beginPath();
      for (let i = 0; i <= 80; i++) {
        const point = bezierPoint(i / 80);
        if (i === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = '#ffdd00';
      for (const guard of guards) {
        ctx.beginPath();
        ctx.moveTo(guard[0], guard[1]);
        ctx.lineTo(guard[2], guard[3]);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawGlassHighlight() {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(512, 582, 467, 535, 0, 0, Math.PI * 2);
      ctx.clip();
      const shine = ctx.createLinearGradient(195, 80, 520, 690);
      shine.addColorStop(0, 'rgba(255,255,255,0)');
      shine.addColorStop(0.43, 'rgba(255,255,255,0)');
      shine.addColorStop(0.49, 'rgba(255,255,255,0.075)');
      shine.addColorStop(0.53, 'rgba(255,255,255,0.018)');
      shine.addColorStop(0.59, 'rgba(255,255,255,0)');
      ctx.fillStyle = shine;
      ctx.fillRect(50, 35, 900, 1080);
      ctx.restore();
    }

    function draw() {
      if (bg.complete && bg.naturalWidth > 0) ctx.drawImage(bg, 0, 0, W, H);
      else {
        ctx.fillStyle = '#120807';
        ctx.fillRect(0, 0, W, H);
      }
      for (const windmill of windmills) drawWindmill(windmill);
      for (const ball of balls) drawBall(ball);
      if (debug) drawDebug();
      drawGlassHighlight();
    }

    let previous = performance.now();
    let accumulator = 0;
    const fixedStep = 1 / 120;
    function frame(now) {
      accumulator += Math.min(0.05, (now - previous) / 1000);
      previous = now;
      while (accumulator >= fixedStep) {
        update(fixedStep);
        accumulator -= fixedStep;
      }
      draw();
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
