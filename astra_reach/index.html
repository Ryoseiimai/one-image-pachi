<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>かえるぱち</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zl1sAAAAASUVORK5CYII=">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #180807; color: #fff7d6; }
    body {
      display: grid;
      place-items: center;
      padding: 8px;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
      overscroll-behavior: none;
      user-select: none;
    }
    main { width: min(100%, calc((100vh - 78px) * 2 / 3), 640px); }
    nav { margin: 0 0 6px; text-align: center; font-size: 11px; }
    nav a { color: #d8c8a7; text-decoration: none; }
    nav a:hover, nav a[aria-current="page"] { color: #fff7d6; text-decoration: underline; }
    nav span { margin: 0 5px; color: #806c55; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 3.5% / 2.35%;
      box-shadow: 0 10px 45px #000b, 0 0 0 2px #f6c539;
      touch-action: none;
      cursor: grab;
      background: #f4d277;
    }
    canvas:active { cursor: grabbing; }
    p { margin: 7px 0 0; text-align: center; font-weight: 700; font-size: clamp(11px, 2.6vw, 14px); }
  </style>
</head>
<body>
  <main>
    <nav aria-label="スキン切替">
      <a href="?skin=kaeru" data-skin="kaeru">かえる</a><span aria-hidden="true">／</span>
      <a href="?skin=neko" data-skin="neko">ねこ</a><span aria-hidden="true">／</span>
      <a href="?skin=inu" data-skin="inu">いぬ</a>
    </nav>
    <canvas id="game" width="1024" height="1536" tabindex="0" aria-label="パチンコゲーム"></canvas>
    <p>ハンドルをドラッグ／← →で発射 · PUSHはSpace・クリック・タップ<br>音はMキー／画面上部で切替</p>
  </main>

  <script>
  (() => {
    'use strict';

    const skins = {
      kaeru: {image: 'kaeru_pachi_source.png', title: 'かえるぱち', main:'#d52218', accent:'#ffd447', symbol:'#d9271c'},
      neko: {image: 'neko_pachi_source.png', title: 'ねこぱち', main:'#8d39cf', accent:'#ff6fbd', symbol:'#a331d1'},
      inu: {image: 'inu_pachi_source.png', title: 'いぬぱち', main:'#1976d2', accent:'#ff8a25', symbol:'#176fc1'}
    };
    const params = new URLSearchParams(location.search);
    const requestedSkin = params.get('skin');
    const skinName = Object.hasOwn(skins, requestedSkin) ? requestedSkin : 'kaeru';
    const skin = skins[skinName];
    const feverMode = params.get('fever') === '1';
    let forcedReach = ['fish','punch','zenkaiten'].includes(params.get('reach')) ? params.get('reach') : null;

    const canvas = document.getElementById('game');
    document.title = skin.title;
    canvas.setAttribute('aria-label', `${skin.title} パチンコゲーム`);
    document.querySelector(`[data-skin="${skinName}"]`).setAttribute('aria-current', 'page');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const bg = new Image();
    bg.src = skin.image;
    const poses = new Image(), symbols = new Image();
    if (skinName === 'neko') {
      poses.src = 'assets/neko_poses_sheet.png';
      symbols.src = 'assets/neko_symbols_sheet.png';
    }

    let stock = 250;
    let handle = 0;
    let targetHandle = 0;
    let dragging = false;
    let last = performance.now();
    let fireClock = 0;
    let windAngle = 0;
    let message = 'ハンドルを回してスタート！';
    let messageTimer = 4;
    let spin = null;
    let holds = 0;
    // A valid reach query previews exactly one spin, without a ball or payout shortcut.
    let nextSpinDelay = forcedReach ? .6 : 0;
    const balls = [];
    const lcd = {x:282, y:505, w:460, h:292};
    const spScreen = {x:W*.05, y:376, w:W*.9, h:770};
    const pushButton = {x:W/2-172, y:spScreen.y+580, w:344, h:118};
    const reachNames = {fish:'魚とり', punch:'猫パンチ', zenkaiten:'全回転'};
    const spPhases = ['develop','story','push','climax','spResult','revival'];

    let audioCtx = null;
    let masterGain = null;
    let muted = false;

    function initAudio() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      if (!audioCtx) {
        audioCtx = new AudioCtor();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = muted ? 0 : .72;
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    }

    function tone(freq, duration=.12, type='sine', volume=.08, delay=0, endFreq=freq) {
      if (!audioCtx || muted || !masterGain) return;
      const now = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(Math.max(1, freq), now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), now + duration);
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + .012);
      gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
      osc.connect(gain); gain.connect(masterGain);
      osc.start(now); osc.stop(now + duration + .025);
    }

    function sfx(name) {
      if (name === 'chime') { tone(1320,.07,'sine',.06); tone(1880,.12,'sine',.045,.065); }
      if (name === 'stop') { tone(135,.085,'triangle',.07); tone(72,.11,'sine',.045,.015); }
      if (name === 'reach') { [392,494,622,784].forEach((f,i)=>tone(f,.2,'square',.035,i*.12,f*1.08)); }
      if (name === 'don') { tone(82,.42,'sine',.18,0,38); tone(48,.5,'triangle',.12,0,30); }
      if (name === 'fan') { [523,659,784,1047,1319].forEach((f,i)=>tone(f,.42,'square',.055,i*.105,f*1.01)); }
      if (name === 'pay') { tone(920,.055,'square',.038); tone(1320,.07,'sine',.035,.045); }
      if (name === 'arp') { [523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.032,i*.13)); }
      if (name === 'develop') { tone(155,.8,'sawtooth',.09,0,34); tone(62,.9,'sine',.18,0,27); }
      if (name === 'spLoop') { [165,220,247,220].forEach((f,i)=>tone(f,.19,'triangle',.035,i*.19)); }
      if (name === 'count') { tone(740,.16,'square',.045); tone(92,.2,'sine',.1); }
      if (name === 'pushReady') { [659,988,1319].forEach((f,i)=>tone(f,.25,'square',.045,i*.08)); }
      if (name === 'push') { tone(55,.5,'sine',.18,0,26); tone(1800,.3,'sawtooth',.06,0,160); }
      if (name === 'success') { [523,659,784,1047,784,1047,1568].forEach((f,i)=>tone(f,.34,'triangle',.085,i*.11)); }
      if (name === 'fail') { [392,330,262,131].forEach((f,i)=>tone(f,.3,'triangle',.065,i*.13,f*.7)); }
      if (name === 'revive') { tone(65,1.2,'sawtooth',.08,0,1300); tone(196,1.1,'triangle',.08,0,784); }
    }

    function toggleMute() {
      initAudio();
      muted = !muted;
      if (masterGain) masterGain.gain.value = muted ? 0 : .72;
    }

    // 画像内座標に合わせた盤面部品。釘は球の流れが中央へ寄るよう少し傾ける。
    const nails = [];
    const addRow = (y, xs) => xs.forEach(x => nails.push({x, y, r: 8}));
    addRow(570, [215, 315, 410, 512, 614, 710, 809]);
    addRow(655, [185, 275, 365, 455, 569, 659, 749, 839]);
    addRow(745, [220, 320, 420, 604, 704, 804]);
    addRow(840, [175, 270, 365, 455, 569, 659, 754, 849]);
    addRow(935, [215, 315, 410, 614, 709, 809]);
    addRow(1030, [255, 345, 435, 589, 679, 769]);
    addRow(1115, [300, 380, 455, 569, 644, 724]);
    // 道釘（ヘソに向かう八の字）
    [[330,1175],[365,1192],[400,1206],[435,1217],[694,1175],[659,1192],[624,1206],[589,1217]]
      .forEach(([x,y]) => nails.push({x,y,r:8}));
    // 命釘2本
    nails.push({x:486,y:1235,r:9,life:true},{x:538,y:1235,r:9,life:true});

    const windmills = [
      {x:270,y:1070,r:37,dir:1},
      {x:754,y:1070,r:37,dir:-1}
    ];

    function spawnBall() {
      if (stock <= 0 || balls.length >= 48) return;
      stock--;
      balls.push({
        x: 135, y: 1325, vx: 0, vy: 0, r: 10,
        mode: 'rail', progress: 0,
        power: handle, age: 0, weakTurn: false
      });
    }

    function setHandleFromPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * W / rect.width;
      const y = (e.clientY - rect.top) * H / rect.height;
      const cx = 879, cy = 1350;
      if (!dragging && Math.hypot(x - cx, y - cy) > 125) return;
      dragging = true;
      // ハンドル中心より右へドラッグすると強くなる。上下方向にも少し反応。
      const dx = x - cx;
      const dy = y - cy;
      targetHandle = Math.max(0, Math.min(1, (dx - dy * .35 + 60) / 175));
    }

    canvas.addEventListener('pointerdown', e => {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * W / rect.width;
      const y = (e.clientY - rect.top) * H / rect.height;
      if (x >= 462 && x <= 562 && y >= 44 && y <= 108) {
        toggleMute();
        return;
      }
      if (spin && spin.phase === 'push' && x >= pushButton.x-30 && x <= pushButton.x+pushButton.w+30 && y >= pushButton.y-25 && y <= pushButton.y+pushButton.h+25) {
        e.preventDefault(); pressPush(); return;
      }
      if (spin && spPhases.includes(spin.phase) && y >= spScreen.y && y <= spScreen.y+spScreen.h) return;
      canvas.setPointerCapture(e.pointerId);
      setHandleFromPointer(e);
    });
    canvas.addEventListener('pointermove', e => { if (dragging) setHandleFromPointer(e); });
    canvas.addEventListener('pointerup', e => {
      dragging = false;
      targetHandle = 0;
      if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointercancel', () => { dragging = false; targetHandle = 0; });

    const keys = {left:false, right:false};
    addEventListener('keydown', e => {
      initAudio();
      if (e.key.toLowerCase() === 'm' && !e.repeat) {
        toggleMute();
        return;
      }
      if (e.code === 'Space') {
        e.preventDefault();
        if (!e.repeat) pressPush();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        keys[e.key === 'ArrowLeft' ? 'left' : 'right'] = true;
      }
    }, {passive:false});
    addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        keys[e.key === 'ArrowLeft' ? 'left' : 'right'] = false;
      }
    }, {passive:false});

    function hitCircle(ball, px, py, pr, bounce=.63) {
      const dx = ball.x - px, dy = ball.y - py;
      const min = ball.r + pr;
      const d2 = dx*dx + dy*dy;
      if (d2 >= min*min || d2 < .0001) return false;
      const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
      const overlap = min - d;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const dot = ball.vx*nx + ball.vy*ny;
      if (dot < 0) {
        ball.vx -= (1+bounce) * dot * nx;
        ball.vy -= (1+bounce) * dot * ny;
        ball.vx += (Math.random()-.5) * 18;
      }
      return true;
    }

    function hitWindmill(ball, w) {
      hitCircle(ball, w.x, w.y, 16, .7);
      const a = windAngle * w.dir;
      for (let k=0;k<4;k++) {
        const ang = a + k*Math.PI/2;
        const ex = w.x + Math.cos(ang)*w.r*.65;
        const ey = w.y + Math.sin(ang)*w.r*.65;
        if (hitCircle(ball, ex, ey, 10, .74)) {
          ball.vx += -Math.sin(ang) * 55 * w.dir;
          ball.vy +=  Math.cos(ang) * 55 * w.dir;
        }
      }
    }

    function enterHeso(index) {
      balls.splice(index, 1);
      stock += 3;
      sfx('chime');
      message = 'ヘソ入賞！ +3発';
      messageTimer = 2;
      if (!spin) {
        startSpin();
      } else if (holds < 4) {
        holds++;
        message = `保留 ${holds}個！`;
      } else {
        message = '保留満タン！';
      }
    }

    function wrapDigit(n) { return ((n - 1) % 7 + 7) % 7 + 1; }

    function startSpin() {
      nextSpinDelay = 0;
      const forced = forcedReach;
      forcedReach = null;
      const win = Math.random() < (feverMode ? 1/3 : 1/60) || forced === 'zenkaiten';
      const left = 1 + (Math.random()*7|0);
      const reach = !!forced || win || Math.random() < .34;
      // 全回転 is selected on 10% of winning spins, never on an ordinary loss.
      const fullRotation = !forced && win && Math.random() < .1;
      // Winning reaches: 10% premium + 90% × 50% regular SP = 55% development.
      const develops = reach && (!!forced || fullRotation || feverMode || Math.random() < (win ? .5 : .55));
      const story = develops ? (forced || (fullRotation ? 'zenkaiten' : Math.random() < .5 ? 'fish' : 'punch')) : null;
      let result;
      if (win) {
        result = [left, left, left];
      } else if (reach) {
        const offset = Math.random() < .5 ? -1 : 1;
        result = [left, wrapDigit(left + offset), left];
      } else {
        let center, right;
        do { center = 1 + (Math.random()*7|0); } while (center === left);
        do { right = 1 + (Math.random()*7|0); } while (right === left || right === center);
        result = [left, center, right];
      }
      spin = {
        phase:'spin', time:0, duration:3.6, elapsed:0,
        win, reach, result, develops, story,
        // Revival is decided once for 8% of failed SPs, before any input.
        revive:develops && !win && Math.random()<.08,
        stopped:[false,false,false], stopSounds:[false,false,false],
        round:0, arpClock:0, loopClock:0, count:0, impactSound:false,
        pushSource:null
      };
      canvas.dataset.story = story || 'normal';
      setPhase('spin');
      message = feverMode ? '変動開始！ FEVER 1/3' : '変動開始！';
      messageTimer = 1.1;
    }

    function setPhase(phase) {
      spin.phase = phase; spin.time = 0;
      canvas.dataset.phase = phase;
      canvas.setAttribute('aria-label', phase === 'push' ? `${skin.title} PUSH！ Spaceまたはボタンをタップ` : `${skin.title} ${reachNames[spin.story] || ''} ${phase === 'spResult' ? (spin.win ? '成功' : 'ハズレ') : ''}`);
    }

    function pressPush(source='user') {
      if (!spin || spin.phase !== 'push') return;
      spin.pushSource = source;
      setPhase('climax');
      sfx('push');
    }

    function settleSP() {
      stopReel(1);
      setPhase('spResult');
      sfx(spin.win ? 'success' : 'fail');
    }

    function stopReel(index) {
      if (!spin || spin.stopped[index]) return;
      spin.stopped[index] = true;
      if (!spin.stopSounds[index]) {
        spin.stopSounds[index] = true;
        sfx('stop');
      }
    }

    function finishResult() {
      if (!spin) return;
      if (spin.win) {
        setPhase('jackpotFlash');
        message = '大当たり！';
        messageTimer = 4;
        sfx('fan');
      } else {
        message = spin.reach ? '惜しい！ ズレ目…' : 'ざんねん…次こそ！';
        messageTimer = 2;
        setPhase('ending');
      }
    }

    function endSpin() {
      spin = null;
      canvas.dataset.phase = 'idle';
      if (holds > 0) {
        holds--;
        nextSpinDelay = .55;
      }
    }

    function update(dt) {
      if (keys.right) targetHandle = Math.min(1, targetHandle + dt*1.05);
      if (keys.left) targetHandle = Math.max(0, targetHandle - dt*1.25);
      if (!dragging && !keys.right && !keys.left) targetHandle = Math.max(0, targetHandle - dt*1.45);
      handle += (targetHandle - handle) * Math.min(1, dt*9);

      fireClock -= dt;
      if (handle > .12 && fireClock <= 0 && stock > 0) {
        spawnBall();
        fireClock = .56;
      }

      windAngle += dt * 3.1;
      messageTimer -= dt;

      if (!spin && nextSpinDelay > 0) {
        nextSpinDelay -= dt;
        if (nextSpinDelay <= 0) startSpin();
      }

      if (spin) {
        spin.time += dt;
        spin.elapsed += dt;
        if (spin.phase === 'spin') {
          if (spin.time >= spin.duration*.48) stopReel(0);
          if (spin.time >= spin.duration*.7) stopReel(2);
          if (spin.reach && spin.time >= spin.duration*.7) {
            setPhase('reach');
            message = 'リーチ！'; messageTimer = 2;
            sfx('reach');
          } else if (!spin.reach && spin.time >= spin.duration) {
            stopReel(1);
            setPhase('result');
          }
        } else if (spin.phase === 'reach') {
          if (spin.time >= 2) {
            if (spin.develops) {
              setPhase('develop'); sfx('develop');
              messageTimer = 0;
            } else {
              stopReel(1); setPhase('result');
            }
          }
        } else if (spin.phase === 'develop' && spin.time >= .8) {
          setPhase('story');
        } else if (spin.phase === 'story') {
          spin.loopClock -= dt;
          if (spin.loopClock <= 0) { sfx(spin.story === 'zenkaiten' ? 'arp' : 'spLoop'); spin.loopClock = .8; }
          if (spin.story === 'punch' && spin.time >= 2.6) {
            const count = Math.max(1,3-Math.floor(spin.time-2.6));
            if (spin.count !== count) { spin.count = count; sfx('count'); }
          }
          if (spin.story === 'zenkaiten' && spin.time >= 6.8) {
            settleSP();
          } else if (spin.story !== 'zenkaiten' && spin.time >= 5.6) {
            setPhase('push'); sfx('pushReady');
          }
        } else if (spin.phase === 'push' && spin.time >= 3) {
          pressPush('auto');
        } else if (spin.phase === 'climax') {
          if (!spin.impactSound && spin.time >= .35) { spin.impactSound = true; sfx('don'); }
          if (spin.time >= 1.1) settleSP();
        } else if (spin.phase === 'spResult' && spin.time >= 1.1) {
          if (spin.revive) { setPhase('revival'); sfx('revive'); }
          else finishResult();
        } else if (spin.phase === 'revival') {
          if (spin.time >= 1.25 && !spin.win) {
            spin.win = true;
            spin.result = [spin.result[0],spin.result[0],spin.result[0]];
            sfx('push'); sfx('success');
          }
          if (spin.time >= 2.3) finishResult();
        } else if (spin.phase === 'result' && spin.time >= 1.35) {
          finishResult();
        } else if (spin.phase === 'ending' && spin.time >= 1.65) {
          endSpin();
        } else if (spin.phase === 'jackpotFlash' && spin.time >= .55) {
          setPhase('jackpotIntro'); spin.arpClock = 0;
        } else if (spin.phase === 'jackpotIntro') {
          spin.arpClock -= dt;
          if (spin.arpClock <= 0) { sfx('arp'); spin.arpClock = .72; }
          if (spin.time >= 3) {
            setPhase('rounds'); spin.round = 1;
            stock += 20; sfx('pay');
          }
        } else if (spin.phase === 'rounds') {
          spin.arpClock -= dt;
          if (spin.arpClock <= 0) { sfx('arp'); spin.arpClock = .72; }
          if (spin.time >= 2) {
            if (spin.round < 10) {
              spin.round++; spin.time = 0; stock += 20; sfx('pay');
            } else {
              setPhase('jackpotEnd');
              message = '大当たり終了！ +200発'; messageTimer = 3;
            }
          }
        } else if (spin.phase === 'jackpotEnd' && spin.time >= 1.6) {
          endSpin();
        }
      }

      for (let i=balls.length-1; i>=0; i--) {
        const b = balls[i];
        b.age += dt;
        if (b.mode === 'rail') {
          // 外周レールを左下→左上へ案内。弱い力は上まで届かず途中で盤面へ落ちる。
          const climbSpeed = 260 + b.power*720;
          b.progress += dt * climbSpeed;
          const y = 1325 - b.progress;
          const curve = Math.sin(Math.min(1,b.progress/1050)*Math.PI) * 24;
          b.x = 137 + curve;
          b.y = y;
          const reachable = 420 + b.power*920;
          if (b.progress > reachable && b.power < .48) {
            b.mode = 'free';
            b.vx = 35 + b.power*80;
            b.vy = 80;
            b.weakTurn = true;
          } else if (b.y <= 245) {
            b.mode = 'free';
            b.x = 170;
            b.y = 245;
            b.vx = 215 + b.power*330;
            b.vy = -110 - b.power*95;
          }
          continue;
        }

        b.vy += 920 * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.vx *= Math.pow(.997, dt*60);

        // 盤面左右のガイド。上部から入った玉を遊技領域に保つ。
        if (b.x < 155+b.r) { b.x=155+b.r; b.vx=Math.abs(b.vx)*.68; }
        if (b.x > 869-b.r) { b.x=869-b.r; b.vx=-Math.abs(b.vx)*.68; }
        if (b.y < 210+b.r) { b.y=210+b.r; b.vy=Math.abs(b.vy)*.65; }

        for (const p of nails) hitCircle(b,p.x,p.y,p.r,.67);
        for (const w of windmills) hitWindmill(b,w);

        // ヘソの漏斗。命釘の間へ落ちた玉だけを入賞として扱う。
        if (b.vy > 0 && b.y > 1240 && b.y < 1305 && b.x > 484 && b.x < 540) {
          enterHeso(i);
          continue;
        }

        // 下部アウト口、または長時間残った玉を回収。
        if (b.y > 1427 || b.age > 18) balls.splice(i,1);
      }
    }

    function roundRect(x,y,w,h,r,fill,stroke) {
      ctx.beginPath();
      ctx.roundRect(x,y,w,h,r);
      if (fill) { ctx.fillStyle=fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=4; ctx.stroke(); }
    }

    function drawNail(p) {
      const g=ctx.createRadialGradient(p.x-3,p.y-4,1,p.x,p.y,p.r+3);
      g.addColorStop(0,'#fff'); g.addColorStop(.28,'#d8e1e8'); g.addColorStop(.65,'#77818a'); g.addColorStop(1,'#22282c');
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r+2,0,Math.PI*2); ctx.fillStyle='#442b0b'; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      if (p.life) { ctx.strokeStyle='#fff3a2';ctx.lineWidth=3;ctx.stroke(); }
    }

    function drawWindmill(w) {
      ctx.save(); ctx.translate(w.x,w.y); ctx.rotate(windAngle*w.dir);
      ctx.strokeStyle='#efe9d3'; ctx.lineWidth=10; ctx.lineCap='round';
      for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,9);ctx.lineTo(0,w.r);ctx.stroke();}
      ctx.restore();
      ctx.beginPath();ctx.arc(w.x,w.y,16,0,Math.PI*2);ctx.fillStyle='#f4c226';ctx.fill();ctx.strokeStyle='#6e2904';ctx.lineWidth=5;ctx.stroke();
    }

    function drawBall(b) {
      const g=ctx.createRadialGradient(b.x-4,b.y-5,1,b.x,b.y,b.r);
      g.addColorStop(0,'#fff');g.addColorStop(.25,'#e8edf0');g.addColorStop(.7,'#8e969c');g.addColorStop(1,'#31373b');
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='#202427';ctx.lineWidth=2;ctx.stroke();
    }

    function drawReels() {
      if (!spin || spPhases.includes(spin.phase)) return;
      const reaching = spin.phase === 'reach';
      const pulse = .55 + .45*Math.sin(performance.now()/105);
      const border = reaching ? `rgba(255,35,25,${pulse})` : skin.accent;
      roundRect(lcd.x,lcd.y,lcd.w,lcd.h,30,'rgba(3,2,8,.83)',border);

      ctx.fillStyle=reaching?'#ff544c':skin.accent;
      ctx.font='900 24px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(reaching?'REACH':'CHANCE',512,lcd.y+30);

      const reelY=lcd.y+55, reelW=110, reelH=158, gap=17, startX=lcd.x+48;
      for(let i=0;i<3;i++){
        const x=startX+i*(reelW+gap);
        roundRect(x,reelY,reelW,reelH,14,'rgba(255,252,239,.95)',skin.accent);
        ctx.save();
        ctx.beginPath();ctx.roundRect(x+4,reelY+4,reelW-8,reelH-8,10);ctx.clip();
        if (spin.stopped[i]) {
          drawSymbol(spin.result[i],x+reelW/2,reelY+reelH/2,72);
        } else {
          const speed=reaching&&i===1?3.1:11.5;
          const travel=(spin.time*speed+i*.31)%1;
          const base=Math.floor(spin.time*speed+i*3);
          for(let k=-1;k<=2;k++){
            const digit=wrapDigit(base+k+1);
            drawSymbol(digit,x+reelW/2,reelY+reelH/2+(k+travel)*92,66);
          }
        }
        ctx.restore();
      }
      ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      let caption='図 柄 変 動 中';
      if (reaching) caption='リ ー チ';
      if (['result','ending'].includes(spin.phase)) caption=spin.win?'3 つ 揃 い！':'ハ ズ レ';
      ctx.fillText(caption,512,lcd.y+264);
    }

    // Seven cells; the empty eighth cell is never sampled. Keep each symbol's aspect ratio.
    function drawSymbol(digit,x,y,size) {
      ctx.save();
      if (skinName === 'neko' && symbols.complete && symbols.naturalWidth) {
        const cellW = symbols.naturalWidth/4, cellH = symbols.naturalHeight/2;
        const index = wrapDigit(digit)-1;
        // Artwork sits within the middle of each 256 x 512 cell.
        const top = index < 4 ? .29 : .065;
        const cropH = cellH*.66, h = size*1.28, w = h*cellW/cropH;
        ctx.beginPath(); ctx.roundRect(x-w/2,y-h/2,w,h,10); ctx.clip();
        ctx.drawImage(symbols,(index%4)*cellW,Math.floor(index/4)*cellH+cellH*top,cellW,cropH,x-w/2,y-h/2,w,h);
      } else {
        const labels = ['魚','鈴','福','桜','糸','缶','掌'];
        ctx.fillStyle=skin.symbol; ctx.strokeStyle=skin.accent; ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(x,y,size*.43,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.font=`900 ${size*.5}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#fff'; ctx.fillText(labels[wrapDigit(digit)-1],x,y);
      }
      ctx.restore();
    }

    function lettering(text,x,y,size=40,color='#fff',stroke='#1c092c') {
      ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
      ctx.font=`1000 ${size}px "Hiragino Sans",system-ui`;
      ctx.lineWidth=Math.max(4,size*.12); ctx.strokeStyle=stroke; ctx.strokeText(text,x,y);
      ctx.fillStyle=color; ctx.fillText(text,x,y); ctx.restore();
    }

    function drawPose(pose,x,y,size,angle=0) {
      ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
      ctx.shadowColor='#000a'; ctx.shadowBlur=24; ctx.shadowOffsetY=12;
      roundRect(-size/2-8,-size/2-8,size+16,size+16,30,'#fff');
      ctx.shadowColor='transparent'; ctx.shadowOffsetY=0;
      roundRect(-size/2-3,-size/2-3,size+6,size+6,25,skin.main);
      ctx.save(); ctx.beginPath(); ctx.roundRect(-size/2+3,-size/2+3,size-6,size-6,21); ctx.clip();
      if (skinName === 'neko' && poses.complete && poses.naturalWidth) {
        const sw=poses.naturalWidth/2, sh=poses.naturalHeight/2;
        ctx.drawImage(poses,(pose%2)*sw,Math.floor(pose/2)*sh,sw,sh,-size/2,-size/2,size,size);
      } else {
        const g=ctx.createLinearGradient(0,-size/2,0,size/2);
        g.addColorStop(0,skin.main); g.addColorStop(1,'#17102b');
        ctx.fillStyle=g; ctx.fillRect(-size/2,-size/2,size,size);
        ctx.scale(size/300,size/300);
        drawMascot(pose);
      }
      ctx.restore();
      ctx.strokeStyle=skin.accent; ctx.lineWidth=5;
      ctx.beginPath(); ctx.roundRect(-size/2,-size/2,size,size,24); ctx.stroke();
      ctx.restore();
    }

    function drawMascot(pose) {
      const frog=skinName==='kaeru';
      ctx.fillStyle=frog?'#9edf70':'#ffc783'; ctx.strokeStyle='#392345'; ctx.lineWidth=5;
      for (const side of [-1,1]) {
        ctx.beginPath(); ctx.ellipse(side*70,-63,frog?37:27,frog?37:65,side*.4,0,Math.PI*2); ctx.fill(); ctx.stroke();
      }
      ctx.beginPath(); ctx.ellipse(0,2,105,85,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      for (const side of [-1,1]) {
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(side*43,-20,24,30,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#251528'; ctx.beginPath(); ctx.arc(side*43,-16,pose===1?14:10,0,Math.PI*2); ctx.fill();
        if (pose===2) { ctx.beginPath(); ctx.moveTo(side*65,-54); ctx.lineTo(side*26,-39); ctx.stroke(); }
      }
      ctx.fillStyle='#ee668c'; ctx.beginPath(); ctx.ellipse(0,37,pose===1?18:36,pose===3?29:18,0,0,Math.PI*2); ctx.fill();
      lettering(['いくよ！','わっ！','全力！','やった！'][pose],0,119,30,skin.accent);
    }

    function drawFish(x,y,size=80,direction=1) {
      ctx.save(); ctx.translate(x,y); ctx.scale(direction*size/100,size/100);
      ctx.lineWidth=5; ctx.strokeStyle='#164b6d';
      ctx.fillStyle='#6ee8ff'; ctx.beginPath(); ctx.moveTo(-35,0); ctx.lineTo(-78,-36); ctx.lineTo(-78,36); ctx.closePath(); ctx.fill(); ctx.stroke();
      const g=ctx.createLinearGradient(0,-35,0,35); g.addColorStop(0,'#e2fcff'); g.addColorStop(.5,'#55dcf6'); g.addColorStop(1,'#2577d5');
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,55,32,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(29,-9,12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#10264a'; ctx.beginPath(); ctx.arc(33,-8,6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#2189b2'; ctx.beginPath(); ctx.moveTo(-5,-21); ctx.quadraticCurveTo(-20,0,-5,21); ctx.stroke();
      ctx.restore();
    }

    function drawMouse(x,y,size=100,angle=0) {
      ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.scale(size/100,size/100);
      ctx.strokeStyle='#eaa1bf'; ctx.lineWidth=9; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(42,15); ctx.bezierCurveTo(125,85,112,-49,152,-11); ctx.stroke();
      ctx.fillStyle='#c0b6d4'; ctx.strokeStyle='#352947'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.ellipse(0,0,62,39,-.08,0,Math.PI*2); ctx.fill(); ctx.stroke();
      for (const x of [-25,14]) {
        ctx.beginPath(); ctx.arc(x,-38,26,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.save(); ctx.fillStyle='#f5bad2'; ctx.beginPath(); ctx.arc(x,-38,16,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
      ctx.fillStyle='#191224'; ctx.beginPath(); ctx.arc(-34,-6,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ed729b'; ctx.beginPath(); ctx.arc(-61,11,8,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    function rays(x,y,time,color=skin.accent) {
      ctx.save(); ctx.translate(x,y);
      for(let i=0;i<30;i++) {
        const a=i*Math.PI/15+time*.15, inner=90+(i%4)*25;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*inner,Math.sin(a)*inner);
        ctx.lineTo(Math.cos(a-.012)*1100,Math.sin(a-.012)*1100);
        ctx.lineTo(Math.cos(a+.012)*1100,Math.sin(a+.012)*1100); ctx.closePath();
        ctx.fillStyle=i%2?color+'66':'#ffffff44'; ctx.fill();
      }
      ctx.restore();
    }

    function spReels(y,time,synced=false,settled=false,size=94) {
      for(let i=0;i<3;i++) {
        const x=450+(i-1)*(size+32);
        roundRect(x-size/2-6,y-size*.7,size+12,size*1.4,16,'#fff6e8',skin.accent);
        ctx.save(); ctx.beginPath(); ctx.roundRect(x-size/2,y-size*.66,size,size*1.32,10); ctx.clip();
        if (settled) drawSymbol(spin.result[i],x,y,size*.9);
        else {
          // The same integrated travel for every reel, easing to an exact symbol.
          const p=Math.min(1,time/6.3), travel=28*(1-Math.pow(1-p,3));
          const base=Math.floor(travel), offset=travel-base;
          for(let k=-1;k<=1;k++) drawSymbol(wrapDigit(spin.result[0]+base+k+(synced?0:i*2)),x,y+(offset-k)*size*1.4,size*.9);
        }
        ctx.restore();
      }
    }

    function drawFishStory(t,outcome=false) {
      const action=spin.phase==='climax' ? Math.min(1,spin.time/1.1) : outcome?1:0;
      const chase=Math.min(t,5.6);
      const fishX=450+Math.sin(chase*2.1)*235;
      const catX=450+Math.sin(chase*2.1-.85)*225;
      const river=ctx.createLinearGradient(0,220,0,560);
      river.addColorStop(0,'#122f56'); river.addColorStop(1,'#36c4d3');
      roundRect(30,202,840,335,30,river);
      for(let i=0;i<11;i++) {
        ctx.strokeStyle='#d3ffff44'; ctx.lineWidth=3;
        ctx.beginPath();
        for(let x=40;x<=860;x+=12) { const y=244+i*26+Math.sin(x/42+t*3+i)*5; if(x===40)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
        ctx.stroke();
      }
      if (action) {
        const leap=Math.sin(action*Math.PI)*155;
        drawPose(action>.7 ? (spin.win?3:1) : 2,catX+(450-catX)*action,390-leap,280,-.14*Math.sin(action*Math.PI));
        const escape=fishX+(1100-fishX)*action;
        drawFish(spin.win ? fishX+(540-fishX)*action : escape,spin.win?280+130*action-leap:270-160*action,85,1);
        if (spin.win && action>.7) rays(530,365,action,'#ffd75c');
      } else {
        for(let i=0;i<4;i++) {
          ctx.fillStyle='#ffffff55'; ctx.beginPath(); ctx.ellipse(catX-90-i*25,513+i%2*8,13-i*2,4,0,0,Math.PI*2); ctx.fill();
        }
        drawPose(chase<2.4?0:1,catX,395+Math.sin(chase*8)*9,264,Math.sin(chase*2.1)*.08);
        drawFish(fishX,263+Math.sin(chase*3.5)*22,83,Math.cos(chase*2.1)>=0?1:-1);
      }
      lettering(outcome?(spin.win?'つかまえた！':'逃げちゃった…'):action?'届け、この一跳び！':t<2.4?'おさかな、待って〜！':'いまだ！ ジャンプのチャンス！',450,169,34,'#e2fcff');
    }

    function drawPunchStory(t,outcome=false) {
      const action=spin.phase==='climax' ? Math.min(1,spin.time/1.1) : outcome?1:0;
      const g=ctx.createLinearGradient(0,200,0,550); g.addColorStop(0,'#3d153a');g.addColorStop(1,'#b44734');
      roundRect(30,202,840,335,30,g);
      ctx.fillStyle='#ffc67b22'; ctx.beginPath(); ctx.ellipse(450,517,365,28,0,0,Math.PI*2); ctx.fill();
      if(action) rays(540,360,spin.time,'#ffd474');
      drawPose(action>.75 ? (spin.win?3:1) : 2,265+Math.sin(action*Math.PI)*160,388,286,action?-.12*Math.sin(action*Math.PI):-.03);
      const mouseX=action ? (spin.win?665+action*550:665-Math.sin(action*Math.PI)*90) : 1100-Math.min(1,t/1.9)*435;
      drawMouse(mouseX,450-(spin.win?Math.sin(action*Math.PI/2)*310:Math.sin(action*Math.PI)*95),100,spin.win?action*8:0);
      if(action>0 && action<.8) {
        const x=450+Math.sin(action*Math.PI)*150;
        ctx.save(); ctx.translate(x,370); ctx.scale(1+action,1+action);
        ctx.fillStyle='#fff2ce';ctx.strokeStyle=skin.accent;ctx.lineWidth=7;
        ctx.beginPath();ctx.ellipse(0,0,45,37,-.3,0,Math.PI*2);ctx.fill();ctx.stroke();
        for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-29+i*27,-29,18,0,Math.PI*2);ctx.fill();ctx.stroke();}
        ctx.restore();
        lettering(spin.win?'ドカーン！':'スカッ…',530,257,48,spin.win?'#ffe572':'#ddd');
      } else if(!action && t>=2.6) {
        const n=Math.max(1,3-Math.floor(t-2.6));
        const scale=1+(1-((t-2.6)%1))*.3;
        lettering(String(n),500,325,105*scale,'#fff2a8');
      } else if(!action) lettering('VS',485,350,72,'#ffe07a');
      lettering(outcome?(spin.win?'一撃、ねこ勝利！':'かわされた…'):action?'必殺！ 猫パンチ！':t<2.6?'いたずらネズミ、登場！':'気合をためろ…！',450,169,34,'#ffe2be');
    }

    function drawZenkaiten(t,settled=false) {
      const g=ctx.createLinearGradient(0,0,900,680);
      ['#ff518b','#ffa638','#eee768','#66e5b5','#61b9ff','#a174f4','#ff74c8'].forEach((c,i)=>g.addColorStop(i/6,c));
      ctx.globalAlpha=.85; roundRect(25,142,850,560,30,g);ctx.globalAlpha=1;
      rays(450,350,t,'#fff0a4');
      drawPose(3,450,337,285,Math.sin(t*1.6)*.04);
      for(let i=0;i<24;i++) {
        const x=50+(i*137)%800,y=180+(i*79+t*45)%300;
        ctx.fillStyle=i%2?'#fff':'#ffe870';ctx.fillRect(x,y,5+i%3,12);
      }
      lettering('祝福の、全回転',450,174,37,'#fff7b2');
      spReels(560,t,true,settled || t>=6.3,110);
      lettering('大当たり確定',450,663,26,'#fff');
    }

    function drawRevival(t) {
      const cracked=t>=.85, restored=t>=1.25;
      ctx.fillStyle='#080515';ctx.fillRect(15,138,870,582);
      if(restored) {
        rays(450,375,t,'#ffd850'); drawPose(3,450,352,285);
        spReels(573,0,false,true,106);
        lettering('復 活 大 当 た り',450,180,53,'#ffe68e');
      } else {
        drawPose(1,450,352,280);ctx.fillStyle='#05020dc0';ctx.fillRect(25,142,850,550);
        lettering('まだ終わらない…',450,389,50,'#fff');
      }
      if(cracked) {
        ctx.save(); ctx.globalAlpha=restored?Math.max(0,1-(t-1.25)/.7):1;
        for(let i=0;i<13;i++) {
          const a=i*Math.PI*2/13;
          ctx.strokeStyle=i%2?'#fff':'#91dbff';ctx.lineWidth=i%3+2;ctx.beginPath();ctx.moveTo(450,375);
          for(let j=1;j<=4;j++) {
            const d=j*165, twist=a+(j%2?.08:-.06);
            ctx.lineTo(450+Math.cos(twist)*d,375+Math.sin(twist)*d);
          }
          ctx.stroke();
          if(restored) {
            const fly=(t-1.25)*650;
            ctx.fillStyle='#c2efff66';ctx.beginPath();ctx.moveTo(450+Math.cos(a)*fly,375+Math.sin(a)*fly);
            ctx.lineTo(450+Math.cos(a-.14)*(fly+130),375+Math.sin(a-.14)*(fly+130));
            ctx.lineTo(450+Math.cos(a+.14)*(fly+170),375+Math.sin(a+.14)*(fly+170));ctx.closePath();ctx.fill();
          }
        }
        ctx.restore();
      }
    }

    function drawPush() {
      const b=pushButton, pulse=1+Math.sin(spin.time*8)*.035;
      ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.scale(pulse,pulse);
      ctx.shadowColor=skin.accent;ctx.shadowBlur=32;
      roundRect(-b.w/2-8,-b.h/2-8,b.w+16,b.h+16,57,'#fff',skin.accent);
      ctx.shadowBlur=0;
      const g=ctx.createLinearGradient(0,-b.h/2,0,b.h/2);g.addColorStop(0,'#fff5d3');g.addColorStop(.3,'#ffe19d');g.addColorStop(1,'#e57c35');
      roundRect(-b.w/2,-b.h/2,b.w,b.h,52,g,skin.main);
      lettering('PUSH',0,1,60,'#fff',skin.main);
      ctx.restore();
      lettering('押せ！',W/2,b.y-42,43,'#ffe98f');
      lettering(`Space / タップ  ·  あと ${Math.max(1,Math.ceil(3-spin.time))} 秒`,W/2,b.y+b.h+27,22,'#fff');
      ctx.fillStyle='#ffffff44';ctx.fillRect(b.x,b.y+b.h+48,b.w,5);
      ctx.fillStyle=skin.accent;ctx.fillRect(b.x,b.y+b.h+48,b.w*Math.max(0,1-spin.time/3),5);
    }

    function drawSP() {
      if(!spin || !spPhases.includes(spin.phase)) return;
      const phase=spin.phase,t=spin.time;
      const opening=phase==='develop';
      const p=opening?Math.min(1,t/.34):1, ease=1-Math.pow(1-p,3);
      ctx.save();ctx.fillStyle=`rgba(3,0,14,${.78*ease})`;ctx.fillRect(0,0,W,H);
      const x=lcd.x+(spScreen.x-lcd.x)*ease, y=lcd.y+(spScreen.y-lcd.y)*ease;
      const w=lcd.w+(spScreen.w-lcd.w)*ease, h=lcd.h+(spScreen.h-lcd.h)*ease;
      ctx.shadowColor=skin.accent;ctx.shadowBlur=35;
      roundRect(x-5,y-5,w+10,h+10,38,'#fff',skin.accent);ctx.shadowBlur=0;
      ctx.translate(x,y);ctx.scale(w/900,h/750);
      ctx.beginPath();ctx.roundRect(0,0,900,750,32);ctx.clip();
      const g=ctx.createLinearGradient(0,0,900,750);g.addColorStop(0,'#241335');g.addColorStop(.52,'#0e102b');g.addColorStop(1,skin.main);
      ctx.fillStyle=g;ctx.fillRect(0,0,900,750);
      for(let i=0;i<28;i++) {
        const sx=(i*173+spin.elapsed*17)%900, sy=(i*91+spin.elapsed*23)%750;
        ctx.fillStyle=i%3?'#ffffff30':skin.accent;ctx.beginPath();ctx.arc(sx,sy,i%3+1,0,Math.PI*2);ctx.fill();
      }
      if(opening) {
        rays(450,375,t);
        const k=.88+Math.min(1,t/.6)*.12;
        ctx.save();ctx.translate(450,365);ctx.scale(k,k);
        lettering('発 展',0,-135,38,'#ffdaa0');
        lettering(skinName==='neko'?'にゃんこSPリーチ':`${skin.title} SPリーチ`,0,-35,61,skin.accent);
        lettering(reachNames[spin.story],0,77,88,'#fff');ctx.restore();
        lettering('運命を変える、一撃へ。',450,570,26,'#e3d6f5');
      } else {
        ctx.fillStyle='#ffffff12';ctx.fillRect(0,0,900,123);
        ctx.fillStyle=skin.accent;ctx.fillRect(30,31,6,65);
        ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#d1bfdc';ctx.font='800 20px system-ui';
        ctx.fillText(skinName==='neko'?'にゃんこSPリーチ':`${skin.title} SPリーチ`,55,44);
        ctx.fillStyle='#fff';ctx.font='1000 39px system-ui';ctx.fillText(reachNames[spin.story],55,84);
        ctx.textAlign='right';ctx.fillStyle=skin.accent;ctx.font='900 21px system-ui';
        ctx.fillText(phase==='revival'?'もう一度！':spin.story==='zenkaiten'?'PREMIUM':phase==='push'?'決めろ！':'SPECIAL REACH',851,65);
        const outcome=phase==='spResult';
        if(phase==='revival') drawRevival(t);
        else if(spin.story==='zenkaiten') drawZenkaiten(outcome?6.8:t,outcome);
        else {
          const storyTime=phase==='story'?t:5.6;
          if(spin.story==='fish') drawFishStory(storyTime,outcome);
          else drawPunchStory(storyTime,outcome);
          if(outcome) {
            if(!spin.win) { ctx.fillStyle='#08071770';ctx.fillRect(25,202,850,335); }
            lettering(spin.win?'大成功！':'ハズレ…',450,574,60,spin.win?'#ffe493':'#c8c2d9');
            spReels(666,0,false,true,66);
          } else if(phase!=='push') {
            lettering(phase==='climax'?'運命の一撃！':'想いを込めて、チャンスをつかめ。',450,596,29,'#ffe9c7');
            const progress=Math.min(1,storyTime/5.6);
            roundRect(220,645,460,7,3,'#ffffff25');roundRect(220,645,460*progress,7,3,skin.accent);
            lettering('発展  ›  ストーリー  ›  PUSH  ›  結果',450,704,21,'#e0c9ec');
          }
        }
      }
      ctx.restore();
      if(phase==='push') drawPush();
      if(phase==='climax' && t<.24 || phase==='revival' && t>=1.25 && t<1.48) {
        const flash=phase==='climax'?t:t-1.25;
        ctx.fillStyle=`rgba(255,255,255,${Math.max(0,1-flash/.24)})`;ctx.fillRect(0,0,W,H);
      }
    }

    function drawHolds() {
      roundRect(377,814,270,65,27,'rgba(5,3,8,.82)',skin.accent);
      ctx.fillStyle='#fff';ctx.font='800 17px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText('保留',438,846);
      for(let i=0;i<4;i++){
        const x=470+i*46;
        ctx.beginPath();ctx.arc(x,846,15,0,Math.PI*2);
        const lit=i<holds;
        ctx.fillStyle=lit?skin.accent:'#282832';ctx.fill();
        ctx.strokeStyle=lit?'#fff7bf':'#777';ctx.lineWidth=4;ctx.stroke();
        if(lit){ctx.beginPath();ctx.arc(x-4,842,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}
      }
    }

    function drawMute() {
      roundRect(462,44,100,64,22,'rgba(18,10,12,.82)',muted?'#888':skin.accent);
      ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(muted?'🔇':'🔊',512,69);
      ctx.font='700 12px system-ui';ctx.fillText(muted?'OFF':'MUTE',512,94);
    }

    function drawJackpot() {
      if (!spin || !['jackpotFlash','jackpotIntro','rounds','jackpotEnd'].includes(spin.phase)) return;
      if (spin.phase==='jackpotFlash') {
        ctx.fillStyle=`rgba(255,255,255,${Math.min(1,1-spin.time/.58+.25)})`;ctx.fillRect(0,0,W,H);
        return;
      }

      ctx.save();
      ctx.fillStyle='rgba(15,0,10,.3)';ctx.fillRect(0,0,W,H);
      ctx.translate(512,760);
      ctx.rotate(-.025*Math.sin(performance.now()/80));
      const zoom=1.22+.05*Math.sin(performance.now()/170);
      ctx.globalAlpha=.88;
      if (bg.complete && bg.naturalWidth) ctx.drawImage(bg,170,430,684,900,-420*zoom,-575*zoom,840*zoom,1125*zoom);
      ctx.globalAlpha=1;
      for(let i=0;i<24;i++){
        const a=i*Math.PI/12+performance.now()/1500;
        ctx.beginPath();ctx.moveTo(Math.cos(a)*170,Math.sin(a)*170);
        ctx.lineTo(Math.cos(a-.035)*760,Math.sin(a-.035)*760);
        ctx.lineTo(Math.cos(a+.035)*760,Math.sin(a+.035)*760);ctx.closePath();
        ctx.fillStyle=i%2?`${skin.accent}55`:'rgba(255,255,255,.22)';ctx.fill();
      }
      ctx.restore();

      ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
      const big=ctx.createLinearGradient(0,250,0,480);big.addColorStop(0,'#fff');big.addColorStop(.3,skin.accent);big.addColorStop(1,skin.main);
      ctx.font='1000 118px "Hiragino Sans",system-ui';ctx.lineWidth=24;ctx.strokeStyle='#5a0000';ctx.strokeText('大当たり',512,360);
      ctx.fillStyle=big;ctx.fillText('大当たり',512,360);

      if (spin.phase==='rounds') {
        roundRect(347,1055,330,145,35,'rgba(8,2,8,.9)',skin.accent);
        ctx.fillStyle='#fff';ctx.font='1000 78px ui-rounded,system-ui';ctx.fillText(`${spin.round}R`,512,1110);
        ctx.fillStyle=skin.accent;ctx.font='900 25px system-ui';ctx.fillText(`払い出し +${spin.round*20} / 200発`,512,1172);
      } else if (spin.phase==='jackpotEnd') {
        roundRect(302,1060,420,105,30,'rgba(8,2,8,.9)',skin.accent);
        ctx.fillStyle='#fff';ctx.font='1000 44px system-ui';ctx.fillText('完 走  +200発',512,1114);
      }
    }

    function drawHeso() {
      // 入賞口の開口部と命釘ラベル
      ctx.save();
      ctx.beginPath();ctx.moveTo(470,1270);ctx.lineTo(554,1270);ctx.lineTo(538,1312);ctx.lineTo(486,1312);ctx.closePath();
      ctx.fillStyle='#17110c';ctx.fill();ctx.strokeStyle='#ffd342';ctx.lineWidth=7;ctx.stroke();
      roundRect(475,1302,74,34,13,'#d61f17','#fff1a3');
      ctx.fillStyle='#fff';ctx.font='900 20px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ヘソ',512,1319);
      ctx.restore();
    }

    function drawRail() {
      ctx.save();ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(135,1345);ctx.quadraticCurveTo(93,790,146,250);ctx.strokeStyle='rgba(38,22,10,.82)';ctx.lineWidth=38;ctx.stroke();
      ctx.beginPath();ctx.moveTo(135,1345);ctx.quadraticCurveTo(93,790,146,250);ctx.strokeStyle='#e6ba3a';ctx.lineWidth=8;ctx.stroke();
      ctx.beginPath();ctx.moveTo(136,1345);ctx.quadraticCurveTo(96,790,146,250);ctx.strokeStyle='#fff0a0';ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
    }

    function drawHandle() {
      const cx=879,cy=1350;
      ctx.save();ctx.translate(cx,cy);
      const g=ctx.createRadialGradient(-20,-25,4,0,0,85);
      g.addColorStop(0,'#fff4a3');g.addColorStop(.28,'#f5c72c');g.addColorStop(.72,'#a9310b');g.addColorStop(1,'#3d1208');
      ctx.beginPath();ctx.arc(0,0,82,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#ffe36b';ctx.lineWidth=8;ctx.stroke();
      ctx.rotate(handle*1.9-.82);
      roundRect(-18,-61,36,85,17,'#35140d','#fff0a1');
      ctx.beginPath();ctx.arc(0,-57,25,0,Math.PI*2);ctx.fillStyle='#db3420';ctx.fill();ctx.strokeStyle='#ffd75a';ctx.lineWidth=5;ctx.stroke();
      ctx.restore();
      ctx.fillStyle='#fff6c9';ctx.font='900 18px system-ui';ctx.textAlign='center';ctx.fillText('ハンドル',cx,1452);
      roundRect(cx-70,1464,140,18,9,'#35140d','#f4c834');
      roundRect(cx-67,1467,134*handle,12,6,handle>.72?'#ffec4f':'#ef6326');
    }

    function drawHud() {
      roundRect(42,42,245,74,22,'rgba(38,8,3,.86)','#ffd247');
      ctx.fillStyle='#fff6cd';ctx.font='700 22px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('持ち玉',65,66);
      ctx.fillStyle=stock>0?'#fff':'#ff7c69';ctx.font='900 38px ui-monospace,monospace';ctx.textAlign='right';ctx.fillText(String(stock).padStart(3,'0'),255,91);
      ctx.fillStyle='#ffd247';ctx.font='700 17px system-ui';ctx.fillText('発',276,91);

      roundRect(737,42,245,74,22,'rgba(38,8,3,.86)','#ffd247');
      ctx.fillStyle='#fff6cd';ctx.font='700 20px system-ui';ctx.textAlign='center';ctx.fillText('盤面の玉',859,67);
      ctx.fillStyle='#fff';ctx.font='900 31px ui-monospace,monospace';ctx.fillText(String(balls.length).padStart(2,'0')+' 発',859,96);
    }

    function drawTitle() {
      ctx.save();
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='900 74px "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui';
      ctx.lineWidth=15;ctx.strokeStyle='rgba(92,29,2,.88)';ctx.strokeText(skin.title,512,166);
      const g=ctx.createLinearGradient(0,125,0,205);g.addColorStop(0,'#fff37b');g.addColorStop(.5,'#ffc51c');g.addColorStop(1,'#ef5b16');
      ctx.fillStyle=g;ctx.fillText(skin.title,512,166);
      ctx.restore();
    }

    function drawMessage() {
      if (messageTimer<=0 && stock>0) return;
      const text = stock<=0 && balls.length===0 ? '玉切れ！ページを再読込で再挑戦' : message;
      roundRect(267,430,490,56,22,'rgba(15,8,2,.78)','#ffe35b');
      ctx.fillStyle='#fff8c9';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,512,458);
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      ctx.save();
      if (spin && spin.phase==='climax' && spin.story==='punch' && spin.time>.18 && spin.time<.8) {
        const force=16*(1-spin.time/1.1);
        ctx.translate(Math.sin(spin.time*110)*force,Math.cos(spin.time*93)*force);
      }
      if (spin && spin.phase==='reach') {
        const amount=3.5+2.5*Math.sin(performance.now()/73);
        ctx.translate(Math.sin(performance.now()/19)*amount,Math.cos(performance.now()/23)*amount);
      }
      if (bg.complete && bg.naturalWidth) ctx.drawImage(bg,0,0,W,H);
      else { ctx.fillStyle='#efe3b8';ctx.fillRect(0,0,W,H); }
      drawRail();
      drawTitle();
      drawHud();
      for (const p of nails) drawNail(p);
      for (const w of windmills) drawWindmill(w);
      drawHeso();
      for (const b of balls) drawBall(b);
      drawHandle();
      drawReels();
      drawHolds();
      drawMessage();
      drawSP();
      drawJackpot();
      ctx.restore();
      drawMute();
    }

    function frame(now) {
      const dt=Math.min(.026,(now-last)/1000||0);last=now;
      update(dt);draw();requestAnimationFrame(frame);
    }
    bg.addEventListener('error', () => { message='背景画像を読み込めません';messageTimer=999; });
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
