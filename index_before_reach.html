<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>かえるぱち</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zl1sAAAAASUVORK5CYII=">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #180807; color: #fff7d6; }
    body {
      display: grid;
      place-items: center;
      padding: 8px;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
      overscroll-behavior: none;
      user-select: none;
    }
    main { width: min(100%, calc((100vh - 78px) * 2 / 3), 640px); }
    nav { margin: 0 0 6px; text-align: center; font-size: 11px; }
    nav a { color: #d8c8a7; text-decoration: none; }
    nav a:hover, nav a[aria-current="page"] { color: #fff7d6; text-decoration: underline; }
    nav span { margin: 0 5px; color: #806c55; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 3.5% / 2.35%;
      box-shadow: 0 10px 45px #000b, 0 0 0 2px #f6c539;
      touch-action: none;
      cursor: grab;
      background: #f4d277;
    }
    canvas:active { cursor: grabbing; }
    p { margin: 7px 0 0; text-align: center; font-weight: 700; font-size: clamp(11px, 2.6vw, 14px); white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="スキン切替">
      <a href="?skin=kaeru" data-skin="kaeru">かえる</a><span aria-hidden="true">／</span>
      <a href="?skin=neko" data-skin="neko">ねこ</a><span aria-hidden="true">／</span>
      <a href="?skin=inu" data-skin="inu">いぬ</a>
    </nav>
    <canvas id="game" width="1024" height="1536" aria-label="パチンコゲーム"></canvas>
    <p>操作：右下のハンドルを左右にドラッグ（← →キーも可）／回すと自動で玉を発射</p>
  </main>

  <script>
  (() => {
    'use strict';

    const skins = {
      kaeru: {image: 'kaeru_pachi_source.png', title: 'かえるぱち', main:'#d52218', accent:'#ffd447', symbol:'#d9271c'},
      neko: {image: 'neko_pachi_source.png', title: 'ねこぱち', main:'#8d39cf', accent:'#ff6fbd', symbol:'#a331d1'},
      inu: {image: 'inu_pachi_source.png', title: 'いぬぱち', main:'#1976d2', accent:'#ff8a25', symbol:'#176fc1'}
    };
    const params = new URLSearchParams(location.search);
    const requestedSkin = params.get('skin');
    const skinName = Object.hasOwn(skins, requestedSkin) ? requestedSkin : 'kaeru';
    const skin = skins[skinName];
    const feverMode = params.get('fever') === '1';

    const canvas = document.getElementById('game');
    document.title = skin.title;
    canvas.setAttribute('aria-label', `${skin.title} パチンコゲーム`);
    document.querySelector(`[data-skin="${skinName}"]`).setAttribute('aria-current', 'page');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const bg = new Image();
    bg.src = skin.image;

    let stock = 250;
    let handle = 0;
    let targetHandle = 0;
    let dragging = false;
    let last = performance.now();
    let fireClock = 0;
    let windAngle = 0;
    let message = 'ハンドルを回してスタート！';
    let messageTimer = 4;
    let spin = null;
    let holds = 0;
    let nextSpinDelay = 0;
    const balls = [];
    const lcd = {x:282, y:505, w:460, h:292};

    let audioCtx = null;
    let masterGain = null;
    let muted = false;

    function initAudio() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      if (!audioCtx) {
        audioCtx = new AudioCtor();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = muted ? 0 : .72;
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    }

    function tone(freq, duration=.12, type='sine', volume=.08, delay=0, endFreq=freq) {
      if (!audioCtx || muted || !masterGain) return;
      const now = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(Math.max(1, freq), now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), now + duration);
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + .012);
      gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
      osc.connect(gain); gain.connect(masterGain);
      osc.start(now); osc.stop(now + duration + .025);
    }

    function sfx(name) {
      if (name === 'chime') { tone(1320,.07,'sine',.06); tone(1880,.12,'sine',.045,.065); }
      if (name === 'stop') { tone(135,.085,'triangle',.07); tone(72,.11,'sine',.045,.015); }
      if (name === 'reach') { [392,494,622,784].forEach((f,i)=>tone(f,.2,'square',.035,i*.12,f*1.08)); }
      if (name === 'don') { tone(82,.42,'sine',.18,0,38); tone(48,.5,'triangle',.12,0,30); }
      if (name === 'fan') { [523,659,784,1047,1319].forEach((f,i)=>tone(f,.42,'square',.055,i*.105,f*1.01)); }
      if (name === 'pay') { tone(920,.055,'square',.038); tone(1320,.07,'sine',.035,.045); }
      if (name === 'arp') { [523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.032,i*.13)); }
    }

    function toggleMute() {
      initAudio();
      muted = !muted;
      if (masterGain) masterGain.gain.value = muted ? 0 : .72;
    }

    // 画像内座標に合わせた盤面部品。釘は球の流れが中央へ寄るよう少し傾ける。
    const nails = [];
    const addRow = (y, xs) => xs.forEach(x => nails.push({x, y, r: 8}));
    addRow(570, [215, 315, 410, 512, 614, 710, 809]);
    addRow(655, [185, 275, 365, 455, 569, 659, 749, 839]);
    addRow(745, [220, 320, 420, 604, 704, 804]);
    addRow(840, [175, 270, 365, 455, 569, 659, 754, 849]);
    addRow(935, [215, 315, 410, 614, 709, 809]);
    addRow(1030, [255, 345, 435, 589, 679, 769]);
    addRow(1115, [300, 380, 455, 569, 644, 724]);
    // 道釘（ヘソに向かう八の字）
    [[330,1175],[365,1192],[400,1206],[435,1217],[694,1175],[659,1192],[624,1206],[589,1217]]
      .forEach(([x,y]) => nails.push({x,y,r:8}));
    // 命釘2本
    nails.push({x:486,y:1235,r:9,life:true},{x:538,y:1235,r:9,life:true});

    const windmills = [
      {x:270,y:1070,r:37,dir:1},
      {x:754,y:1070,r:37,dir:-1}
    ];

    function spawnBall() {
      if (stock <= 0 || balls.length >= 48) return;
      stock--;
      balls.push({
        x: 135, y: 1325, vx: 0, vy: 0, r: 10,
        mode: 'rail', progress: 0,
        power: handle, age: 0, weakTurn: false
      });
    }

    function setHandleFromPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * W / rect.width;
      const y = (e.clientY - rect.top) * H / rect.height;
      const cx = 879, cy = 1350;
      if (!dragging && Math.hypot(x - cx, y - cy) > 125) return;
      dragging = true;
      // ハンドル中心より右へドラッグすると強くなる。上下方向にも少し反応。
      const dx = x - cx;
      const dy = y - cy;
      targetHandle = Math.max(0, Math.min(1, (dx - dy * .35 + 60) / 175));
    }

    canvas.addEventListener('pointerdown', e => {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * W / rect.width;
      const y = (e.clientY - rect.top) * H / rect.height;
      if (x >= 462 && x <= 562 && y >= 44 && y <= 108) {
        toggleMute();
        return;
      }
      canvas.setPointerCapture(e.pointerId);
      setHandleFromPointer(e);
    });
    canvas.addEventListener('pointermove', e => { if (dragging) setHandleFromPointer(e); });
    canvas.addEventListener('pointerup', e => {
      dragging = false;
      targetHandle = 0;
      if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointercancel', () => { dragging = false; targetHandle = 0; });

    const keys = {left:false, right:false};
    addEventListener('keydown', e => {
      initAudio();
      if (e.key.toLowerCase() === 'm' && !e.repeat) {
        toggleMute();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        keys[e.key === 'ArrowLeft' ? 'left' : 'right'] = true;
      }
    }, {passive:false});
    addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        keys[e.key === 'ArrowLeft' ? 'left' : 'right'] = false;
      }
    }, {passive:false});

    function hitCircle(ball, px, py, pr, bounce=.63) {
      const dx = ball.x - px, dy = ball.y - py;
      const min = ball.r + pr;
      const d2 = dx*dx + dy*dy;
      if (d2 >= min*min || d2 < .0001) return false;
      const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
      const overlap = min - d;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const dot = ball.vx*nx + ball.vy*ny;
      if (dot < 0) {
        ball.vx -= (1+bounce) * dot * nx;
        ball.vy -= (1+bounce) * dot * ny;
        ball.vx += (Math.random()-.5) * 18;
      }
      return true;
    }

    function hitWindmill(ball, w) {
      hitCircle(ball, w.x, w.y, 16, .7);
      const a = windAngle * w.dir;
      for (let k=0;k<4;k++) {
        const ang = a + k*Math.PI/2;
        const ex = w.x + Math.cos(ang)*w.r*.65;
        const ey = w.y + Math.sin(ang)*w.r*.65;
        if (hitCircle(ball, ex, ey, 10, .74)) {
          ball.vx += -Math.sin(ang) * 55 * w.dir;
          ball.vy +=  Math.cos(ang) * 55 * w.dir;
        }
      }
    }

    function enterHeso(index) {
      balls.splice(index, 1);
      stock += 3;
      sfx('chime');
      message = 'ヘソ入賞！ +3発';
      messageTimer = 2;
      if (!spin) {
        startSpin();
      } else if (holds < 4) {
        holds++;
        message = `保留 ${holds}個！`;
      } else {
        message = '保留満タン！';
      }
    }

    function wrapDigit(n) { return ((n - 1 + 9) % 9) + 1; }

    function startSpin() {
      const win = Math.random() < (feverMode ? 1/3 : 1/60);
      const left = 1 + (Math.random()*9|0);
      const reach = win || Math.random() < .34;
      let result;
      if (win) {
        result = [left, left, left];
      } else if (reach) {
        const offset = Math.random() < .5 ? -1 : 1;
        result = [left, wrapDigit(left + offset), left];
      } else {
        let center, right;
        do { center = 1 + (Math.random()*9|0); } while (center === left);
        do { right = 1 + (Math.random()*9|0); } while (right === left || right === center);
        result = [left, center, right];
      }
      spin = {
        phase:'spin', time:0, duration:3+Math.random()*2,
        reachDuration:6+Math.random()*3, win, reach, result,
        cutIn:reach && Math.random()<.3, stopped:[false,false,false],
        stopSounds:[false,false,false], round:0, arpClock:0
      };
      message = feverMode ? '変動開始！ FEVER 1/3' : '変動開始！';
      messageTimer = 1.1;
    }

    function stopReel(index) {
      if (!spin || spin.stopped[index]) return;
      spin.stopped[index] = true;
      if (!spin.stopSounds[index]) {
        spin.stopSounds[index] = true;
        sfx('stop');
      }
    }

    function finishResult() {
      if (!spin) return;
      if (spin.win) {
        spin.phase = 'jackpotFlash';
        spin.time = 0;
        message = '大当たり！';
        messageTimer = 4;
        sfx('fan');
      } else {
        message = spin.reach ? '惜しい！ ズレ目…' : 'ざんねん…次こそ！';
        messageTimer = 2;
        spin.phase = 'ending';
        spin.time = 0;
      }
    }

    function endSpin() {
      spin = null;
      if (holds > 0) {
        holds--;
        nextSpinDelay = .55;
      }
    }

    function update(dt) {
      if (keys.right) targetHandle = Math.min(1, targetHandle + dt*1.05);
      if (keys.left) targetHandle = Math.max(0, targetHandle - dt*1.25);
      if (!dragging && !keys.right && !keys.left) targetHandle = Math.max(0, targetHandle - dt*1.45);
      handle += (targetHandle - handle) * Math.min(1, dt*9);

      fireClock -= dt;
      if (handle > .12 && fireClock <= 0 && stock > 0) {
        spawnBall();
        fireClock = .56;
      }

      windAngle += dt * 3.1;
      messageTimer -= dt;

      if (!spin && nextSpinDelay > 0) {
        nextSpinDelay -= dt;
        if (nextSpinDelay <= 0) startSpin();
      }

      if (spin) {
        spin.time += dt;
        if (spin.phase === 'spin') {
          if (spin.time >= spin.duration*.48) stopReel(0);
          if (spin.time >= spin.duration*.7) stopReel(2);
          if (spin.reach && spin.time >= spin.duration*.7) {
            spin.phase = 'reach'; spin.time = 0;
            message = 'リーチ！'; messageTimer = 2;
            sfx('reach');
            if (spin.cutIn) sfx('don');
          } else if (!spin.reach && spin.time >= spin.duration) {
            stopReel(1);
            spin.phase = 'result'; spin.time = 0;
          }
        } else if (spin.phase === 'reach') {
          if (spin.time >= spin.reachDuration) {
            stopReel(1);
            spin.phase = 'result'; spin.time = 0;
          }
        } else if (spin.phase === 'result' && spin.time >= 1.35) {
          finishResult();
        } else if (spin.phase === 'ending' && spin.time >= 1.65) {
          endSpin();
        } else if (spin.phase === 'jackpotFlash' && spin.time >= .55) {
          spin.phase = 'jackpotIntro'; spin.time = 0; spin.arpClock = 0;
        } else if (spin.phase === 'jackpotIntro') {
          spin.arpClock -= dt;
          if (spin.arpClock <= 0) { sfx('arp'); spin.arpClock = .72; }
          if (spin.time >= 3) {
            spin.phase = 'rounds'; spin.time = 0; spin.round = 1;
            stock += 20; sfx('pay');
          }
        } else if (spin.phase === 'rounds') {
          spin.arpClock -= dt;
          if (spin.arpClock <= 0) { sfx('arp'); spin.arpClock = .72; }
          if (spin.time >= 2) {
            if (spin.round < 10) {
              spin.round++; spin.time = 0; stock += 20; sfx('pay');
            } else {
              spin.phase = 'jackpotEnd'; spin.time = 0;
              message = '大当たり終了！ +200発'; messageTimer = 3;
            }
          }
        } else if (spin.phase === 'jackpotEnd' && spin.time >= 1.6) {
          endSpin();
        }
      }

      for (let i=balls.length-1; i>=0; i--) {
        const b = balls[i];
        b.age += dt;
        if (b.mode === 'rail') {
          // 外周レールを左下→左上へ案内。弱い力は上まで届かず途中で盤面へ落ちる。
          const climbSpeed = 260 + b.power*720;
          b.progress += dt * climbSpeed;
          const y = 1325 - b.progress;
          const curve = Math.sin(Math.min(1,b.progress/1050)*Math.PI) * 24;
          b.x = 137 + curve;
          b.y = y;
          const reachable = 420 + b.power*920;
          if (b.progress > reachable && b.power < .48) {
            b.mode = 'free';
            b.vx = 35 + b.power*80;
            b.vy = 80;
            b.weakTurn = true;
          } else if (b.y <= 245) {
            b.mode = 'free';
            b.x = 170;
            b.y = 245;
            b.vx = 215 + b.power*330;
            b.vy = -110 - b.power*95;
          }
          continue;
        }

        b.vy += 920 * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.vx *= Math.pow(.997, dt*60);

        // 盤面左右のガイド。上部から入った玉を遊技領域に保つ。
        if (b.x < 155+b.r) { b.x=155+b.r; b.vx=Math.abs(b.vx)*.68; }
        if (b.x > 869-b.r) { b.x=869-b.r; b.vx=-Math.abs(b.vx)*.68; }
        if (b.y < 210+b.r) { b.y=210+b.r; b.vy=Math.abs(b.vy)*.65; }

        for (const p of nails) hitCircle(b,p.x,p.y,p.r,.67);
        for (const w of windmills) hitWindmill(b,w);

        // ヘソの漏斗。命釘の間へ落ちた玉だけを入賞として扱う。
        if (b.vy > 0 && b.y > 1240 && b.y < 1305 && b.x > 484 && b.x < 540) {
          enterHeso(i);
          continue;
        }

        // 下部アウト口、または長時間残った玉を回収。
        if (b.y > 1427 || b.age > 18) balls.splice(i,1);
      }
    }

    function roundRect(x,y,w,h,r,fill,stroke) {
      ctx.beginPath();
      ctx.roundRect(x,y,w,h,r);
      if (fill) { ctx.fillStyle=fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=4; ctx.stroke(); }
    }

    function drawNail(p) {
      const g=ctx.createRadialGradient(p.x-3,p.y-4,1,p.x,p.y,p.r+3);
      g.addColorStop(0,'#fff'); g.addColorStop(.28,'#d8e1e8'); g.addColorStop(.65,'#77818a'); g.addColorStop(1,'#22282c');
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r+2,0,Math.PI*2); ctx.fillStyle='#442b0b'; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      if (p.life) { ctx.strokeStyle='#fff3a2';ctx.lineWidth=3;ctx.stroke(); }
    }

    function drawWindmill(w) {
      ctx.save(); ctx.translate(w.x,w.y); ctx.rotate(windAngle*w.dir);
      ctx.strokeStyle='#efe9d3'; ctx.lineWidth=10; ctx.lineCap='round';
      for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,9);ctx.lineTo(0,w.r);ctx.stroke();}
      ctx.restore();
      ctx.beginPath();ctx.arc(w.x,w.y,16,0,Math.PI*2);ctx.fillStyle='#f4c226';ctx.fill();ctx.strokeStyle='#6e2904';ctx.lineWidth=5;ctx.stroke();
    }

    function drawBall(b) {
      const g=ctx.createRadialGradient(b.x-4,b.y-5,1,b.x,b.y,b.r);
      g.addColorStop(0,'#fff');g.addColorStop(.25,'#e8edf0');g.addColorStop(.7,'#8e969c');g.addColorStop(1,'#31373b');
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='#202427';ctx.lineWidth=2;ctx.stroke();
    }

    function drawReels() {
      if (!spin) return;
      const reaching = spin.phase === 'reach';
      const pulse = .55 + .45*Math.sin(performance.now()/105);
      const border = reaching ? `rgba(255,35,25,${pulse})` : skin.accent;
      roundRect(lcd.x,lcd.y,lcd.w,lcd.h,30,'rgba(3,2,8,.83)',border);

      if (reaching && spin.cutIn) {
        ctx.save();
        ctx.beginPath();ctx.roundRect(lcd.x+5,lcd.y+5,lcd.w-10,lcd.h-10,25);ctx.clip();
        ctx.globalAlpha=.74;
        const zoom=1.15+Math.min(.25,spin.time*.035);
        const sw=610/zoom, sh=700/zoom;
        ctx.drawImage(bg,512-sw/2,455,sw,sh,lcd.x,lcd.y,lcd.w,lcd.h);
        ctx.globalAlpha=1;
        const hot=ctx.createLinearGradient(0,lcd.y+180,0,lcd.y+286);
        hot.addColorStop(0,'#fff');hot.addColorStop(.3,skin.accent);hot.addColorStop(1,skin.main);
        ctx.font='1000 78px "Hiragino Sans",system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.lineWidth=16;ctx.strokeStyle='rgba(35,0,0,.92)';ctx.strokeText('激アツ',512,lcd.y+235);
        ctx.fillStyle=hot;ctx.fillText('激アツ',512,lcd.y+235);
        ctx.restore();
      }

      ctx.fillStyle=reaching?'#ff544c':skin.accent;
      ctx.font='900 24px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(reaching?'REACH':'CHANCE',512,lcd.y+30);

      const reelY=lcd.y+55, reelW=110, reelH=158, gap=17, startX=lcd.x+48;
      for(let i=0;i<3;i++){
        const x=startX+i*(reelW+gap);
        roundRect(x,reelY,reelW,reelH,14,'rgba(255,252,239,.95)',skin.accent);
        ctx.save();
        ctx.beginPath();ctx.roundRect(x+4,reelY+4,reelW-8,reelH-8,10);ctx.clip();
        if (spin.stopped[i]) {
          drawDigit(spin.result[i],x+reelW/2,reelY+reelH/2,72);
        } else {
          const speed=reaching&&i===1?3.1:11.5;
          const travel=(spin.time*speed+i*.31)%1;
          const base=Math.floor(spin.time*speed+i*3);
          for(let k=-1;k<=2;k++){
            const digit=wrapDigit(base+k+1);
            drawDigit(digit,x+reelW/2,reelY+reelH/2+(k+travel)*92,66);
          }
        }
        ctx.restore();
      }
      ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      let caption='図 柄 変 動 中';
      if (reaching) caption='リ ー チ';
      if (spin.phase==='result') caption=spin.win?'3 つ 揃 い！':'ハ ズ レ';
      ctx.fillText(caption,512,lcd.y+264);
    }

    function drawDigit(digit,x,y,size) {
      ctx.font=`1000 ${size}px ui-rounded,"Hiragino Sans",system-ui`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
      ctx.lineWidth=Math.max(7,size*.12);ctx.strokeStyle='#fff';ctx.strokeText(String(digit),x,y);
      ctx.lineWidth=Math.max(3,size*.045);ctx.strokeStyle=skin.accent;ctx.strokeText(String(digit),x,y);
      ctx.fillStyle=skin.symbol;ctx.fillText(String(digit),x,y);
    }

    function drawHolds() {
      roundRect(377,814,270,65,27,'rgba(5,3,8,.82)',skin.accent);
      ctx.fillStyle='#fff';ctx.font='800 17px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText('保留',438,846);
      for(let i=0;i<4;i++){
        const x=470+i*46;
        ctx.beginPath();ctx.arc(x,846,15,0,Math.PI*2);
        const lit=i<holds;
        ctx.fillStyle=lit?skin.accent:'#282832';ctx.fill();
        ctx.strokeStyle=lit?'#fff7bf':'#777';ctx.lineWidth=4;ctx.stroke();
        if(lit){ctx.beginPath();ctx.arc(x-4,842,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}
      }
    }

    function drawMute() {
      roundRect(462,44,100,64,22,'rgba(18,10,12,.82)',muted?'#888':skin.accent);
      ctx.fillStyle='#fff';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(muted?'🔇':'🔊',512,69);
      ctx.font='700 12px system-ui';ctx.fillText(muted?'OFF':'MUTE',512,94);
    }

    function drawJackpot() {
      if (!spin || !['jackpotFlash','jackpotIntro','rounds','jackpotEnd'].includes(spin.phase)) return;
      if (spin.phase==='jackpotFlash') {
        ctx.fillStyle=`rgba(255,255,255,${Math.min(1,1-spin.time/.58+.25)})`;ctx.fillRect(0,0,W,H);
        return;
      }

      ctx.save();
      ctx.fillStyle='rgba(15,0,10,.3)';ctx.fillRect(0,0,W,H);
      ctx.translate(512,760);
      ctx.rotate(-.025*Math.sin(performance.now()/80));
      const zoom=1.22+.05*Math.sin(performance.now()/170);
      ctx.globalAlpha=.88;
      ctx.drawImage(bg,170,430,684,900,-420*zoom,-575*zoom,840*zoom,1125*zoom);
      ctx.globalAlpha=1;
      for(let i=0;i<24;i++){
        const a=i*Math.PI/12+performance.now()/1500;
        ctx.beginPath();ctx.moveTo(Math.cos(a)*170,Math.sin(a)*170);
        ctx.lineTo(Math.cos(a-.035)*760,Math.sin(a-.035)*760);
        ctx.lineTo(Math.cos(a+.035)*760,Math.sin(a+.035)*760);ctx.closePath();
        ctx.fillStyle=i%2?`${skin.accent}55`:'rgba(255,255,255,.22)';ctx.fill();
      }
      ctx.restore();

      ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
      const big=ctx.createLinearGradient(0,250,0,480);big.addColorStop(0,'#fff');big.addColorStop(.3,skin.accent);big.addColorStop(1,skin.main);
      ctx.font='1000 118px "Hiragino Sans",system-ui';ctx.lineWidth=24;ctx.strokeStyle='#5a0000';ctx.strokeText('大当たり',512,360);
      ctx.fillStyle=big;ctx.fillText('大当たり',512,360);

      if (spin.phase==='rounds') {
        roundRect(347,1055,330,145,35,'rgba(8,2,8,.9)',skin.accent);
        ctx.fillStyle='#fff';ctx.font='1000 78px ui-rounded,system-ui';ctx.fillText(`${spin.round}R`,512,1110);
        ctx.fillStyle=skin.accent;ctx.font='900 25px system-ui';ctx.fillText(`払い出し +${spin.round*20} / 200発`,512,1172);
      } else if (spin.phase==='jackpotEnd') {
        roundRect(302,1060,420,105,30,'rgba(8,2,8,.9)',skin.accent);
        ctx.fillStyle='#fff';ctx.font='1000 44px system-ui';ctx.fillText('完 走  +200発',512,1114);
      }
    }

    function drawHeso() {
      // 入賞口の開口部と命釘ラベル
      ctx.save();
      ctx.beginPath();ctx.moveTo(470,1270);ctx.lineTo(554,1270);ctx.lineTo(538,1312);ctx.lineTo(486,1312);ctx.closePath();
      ctx.fillStyle='#17110c';ctx.fill();ctx.strokeStyle='#ffd342';ctx.lineWidth=7;ctx.stroke();
      roundRect(475,1302,74,34,13,'#d61f17','#fff1a3');
      ctx.fillStyle='#fff';ctx.font='900 20px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ヘソ',512,1319);
      ctx.restore();
    }

    function drawRail() {
      ctx.save();ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(135,1345);ctx.quadraticCurveTo(93,790,146,250);ctx.strokeStyle='rgba(38,22,10,.82)';ctx.lineWidth=38;ctx.stroke();
      ctx.beginPath();ctx.moveTo(135,1345);ctx.quadraticCurveTo(93,790,146,250);ctx.strokeStyle='#e6ba3a';ctx.lineWidth=8;ctx.stroke();
      ctx.beginPath();ctx.moveTo(136,1345);ctx.quadraticCurveTo(96,790,146,250);ctx.strokeStyle='#fff0a0';ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
    }

    function drawHandle() {
      const cx=879,cy=1350;
      ctx.save();ctx.translate(cx,cy);
      const g=ctx.createRadialGradient(-20,-25,4,0,0,85);
      g.addColorStop(0,'#fff4a3');g.addColorStop(.28,'#f5c72c');g.addColorStop(.72,'#a9310b');g.addColorStop(1,'#3d1208');
      ctx.beginPath();ctx.arc(0,0,82,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#ffe36b';ctx.lineWidth=8;ctx.stroke();
      ctx.rotate(handle*1.9-.82);
      roundRect(-18,-61,36,85,17,'#35140d','#fff0a1');
      ctx.beginPath();ctx.arc(0,-57,25,0,Math.PI*2);ctx.fillStyle='#db3420';ctx.fill();ctx.strokeStyle='#ffd75a';ctx.lineWidth=5;ctx.stroke();
      ctx.restore();
      ctx.fillStyle='#fff6c9';ctx.font='900 18px system-ui';ctx.textAlign='center';ctx.fillText('ハンドル',cx,1452);
      roundRect(cx-70,1464,140,18,9,'#35140d','#f4c834');
      roundRect(cx-67,1467,134*handle,12,6,handle>.72?'#ffec4f':'#ef6326');
    }

    function drawHud() {
      roundRect(42,42,245,74,22,'rgba(38,8,3,.86)','#ffd247');
      ctx.fillStyle='#fff6cd';ctx.font='700 22px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('持ち玉',65,66);
      ctx.fillStyle=stock>0?'#fff':'#ff7c69';ctx.font='900 38px ui-monospace,monospace';ctx.textAlign='right';ctx.fillText(String(stock).padStart(3,'0'),255,91);
      ctx.fillStyle='#ffd247';ctx.font='700 17px system-ui';ctx.fillText('発',276,91);

      roundRect(737,42,245,74,22,'rgba(38,8,3,.86)','#ffd247');
      ctx.fillStyle='#fff6cd';ctx.font='700 20px system-ui';ctx.textAlign='center';ctx.fillText('盤面の玉',859,67);
      ctx.fillStyle='#fff';ctx.font='900 31px ui-monospace,monospace';ctx.fillText(String(balls.length).padStart(2,'0')+' 発',859,96);
    }

    function drawTitle() {
      ctx.save();
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='900 74px "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui';
      ctx.lineWidth=15;ctx.strokeStyle='rgba(92,29,2,.88)';ctx.strokeText(skin.title,512,166);
      const g=ctx.createLinearGradient(0,125,0,205);g.addColorStop(0,'#fff37b');g.addColorStop(.5,'#ffc51c');g.addColorStop(1,'#ef5b16');
      ctx.fillStyle=g;ctx.fillText(skin.title,512,166);
      ctx.restore();
    }

    function drawMessage() {
      if (messageTimer<=0 && stock>0) return;
      const text = stock<=0 && balls.length===0 ? '玉切れ！ページを再読込で再挑戦' : message;
      roundRect(267,430,490,56,22,'rgba(15,8,2,.78)','#ffe35b');
      ctx.fillStyle='#fff8c9';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,512,458);
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      ctx.save();
      if (spin && spin.phase==='reach') {
        const amount=3.5+2.5*Math.sin(performance.now()/73);
        ctx.translate((Math.random()-.5)*amount,(Math.random()-.5)*amount);
      }
      if (bg.complete && bg.naturalWidth) ctx.drawImage(bg,0,0,W,H);
      else { ctx.fillStyle='#efe3b8';ctx.fillRect(0,0,W,H); }
      drawRail();
      drawTitle();
      drawHud();
      for (const p of nails) drawNail(p);
      for (const w of windmills) drawWindmill(w);
      drawHeso();
      for (const b of balls) drawBall(b);
      drawHandle();
      drawReels();
      drawHolds();
      drawMessage();
      drawJackpot();
      ctx.restore();
      drawMute();
    }

    function frame(now) {
      const dt=Math.min(.026,(now-last)/1000||0);last=now;
      update(dt);draw();requestAnimationFrame(frame);
    }
    bg.addEventListener('error', () => { message='背景画像を読み込めません';messageTimer=999; });
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
